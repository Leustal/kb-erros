<!DOCTYPE html>
<html lang="pt-BR" data-theme="dark">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">

  <title>SaveInCloud - KB & Quality Audit</title>

  <link
    rel="icon"
    href="data:image/svg+xml,<svg xmlns=%22http://www.w3.org/2000/svg%22 viewBox=%220 0 100 100%22><text y=%22.9em%22 font-size=%2290%22>🧠</text></svg>"
  >

  <style>
    :root {
      --bg-body: #0b0f19;
      --bg-card: #151d30;
      --bg-input: #1b253d;
      --bg-tag: #0284c720;
      --bg-badge: #0f172a;
      --bg-tab-active: #06b6d4;
      --border-color: #24314d;
      --text-main: #f8fafc;
      --text-muted: #94a3b8;
      --text-highlight: #38bdf8;
      --shadow-color: rgba(0, 0, 0, 0.35);
      --btn-danger: #ef4444;
      --btn-warning: #f59e0b;
      --btn-primary: #06b6d4;
    }

    [data-theme="light"] {
      --bg-body: #f1f5f9;
      --bg-card: #ffffff;
      --bg-input: #ffffff;
      --bg-tag: #e0f2fe;
      --bg-badge: #e2e8f0;
      --bg-tab-active: #0284c7;
      --border-color: #cbd5e1;
      --text-main: #0f172a;
      --text-muted: #64748b;
      --text-highlight: #0284c7;
      --shadow-color: rgba(0, 0, 0, 0.05);
      --btn-danger: #dc2626;
      --btn-warning: #d97706;
      --btn-primary: #0284c7;
    }

    * {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI",
        Roboto, Helvetica, Arial, sans-serif;

      transition:
        background-color 0.25s ease,
        border-color 0.25s ease,
        color 0.25s ease;
    }

    body {
      background-color: var(--bg-body);
      color: var(--text-main);
      padding: 24px;
      max-width: 1200px;
      margin: 0 auto;
    }

    .header {
      display: flex;
      justify-content: space-between;
      align-items: center;
      margin-bottom: 24px;
      padding-bottom: 16px;
      border-bottom: 1px solid var(--border-color);
    }

    .title-container {
      display: flex;
      align-items: center;
      gap: 12px;
    }

    .title-container h1 {
      font-size: 1.4rem;
      font-weight: 700;
      color: var(--text-main);
    }

    .logo-icon {
      width: 24px;
      height: 24px;
      background-color: #06b6d4;
      border-radius: 50%;
      box-shadow: 0 0 12px #06b6d480;
    }

    .header-actions {
      display: flex;
      align-items: center;
      gap: 12px;
    }

    .btn-new {
      background-color: var(--btn-primary);
      color: #ffffff;
      border: none;
      padding: 8px 16px;
      border-radius: 20px;
      cursor: pointer;
      font-size: 0.85rem;
      font-weight: 600;
      box-shadow: 0 4px 12px var(--shadow-color);
    }

    .btn-new:hover {
      opacity: 0.9;
    }

    .theme-toggle-btn {
      background: var(--bg-card);
      border: 1px solid var(--border-color);
      color: var(--text-main);
      padding: 8px 14px;
      border-radius: 20px;
      cursor: pointer;
      font-size: 0.85rem;
      font-weight: 600;
      display: flex;
      align-items: center;
      gap: 6px;
      box-shadow: 0 4px 12px var(--shadow-color);
    }

    .status-loading {
      font-size: 0.85rem;
      color: var(--text-muted);
    }

    .search-container {
      margin-bottom: 24px;
    }

    .search-input {
      width: 100%;
      padding: 16px 20px;
      background-color: var(--bg-input);
      border: 1px solid var(--border-color);
      border-radius: 16px;
      color: var(--text-main);
      font-size: 0.95rem;
      outline: none;
      box-shadow: 0 6px 16px var(--shadow-color);
    }

    .search-input:focus {
      border-color: var(--text-highlight);
    }

    .cards-grid {
      display: flex;
      flex-direction: column;
      gap: 20px;
    }

    .card {
      background-color: var(--bg-card);
      border: 1px solid var(--border-color);
      border-radius: 20px;
      padding: 24px;
      box-shadow: 0 8px 24px var(--shadow-color);
    }

    .card-header {
      display: flex;
      justify-content: space-between;
      align-items: flex-start;
      margin-bottom: 16px;
      gap: 12px;
    }

    .card-title {
      font-size: 1.15rem;
      font-weight: 700;
      color: var(--text-highlight);
      line-height: 1.4;
    }

    .card-header-actions {
      display: flex;
      align-items: center;
      gap: 8px;
    }

    .badge {
      background-color: var(--bg-badge);
      color: var(--text-muted);
      padding: 6px 12px;
      border-radius: 12px;
      font-size: 0.75rem;
      font-weight: 600;
      border: 1px solid var(--border-color);
      white-space: nowrap;
    }

    .btn-action {
      background: transparent;
      border: 1px solid var(--border-color);
      color: var(--text-main);
      padding: 6px 10px;
      border-radius: 10px;
      cursor: pointer;
      font-size: 0.75rem;
      font-weight: 600;
    }

    .btn-action:hover {
      border-color: var(--text-highlight);
    }

    .btn-edit {
      color: var(--btn-warning);
    }

    .btn-delete {
      color: var(--btn-danger);
    }

    .card-tabs {
      display: flex;
      gap: 8px;
      margin-bottom: 20px;
      border-bottom: 1px solid var(--border-color);
      padding-bottom: 8px;
    }

    .tab-btn {
      background: transparent;
      border: none;
      color: var(--text-muted);
      padding: 8px 16px;
      border-radius: 10px;
      font-size: 0.85rem;
      font-weight: 600;
      cursor: pointer;
    }

    .tab-btn.active {
      background-color: var(--bg-tab-active);
      color: #ffffff;
    }

    .tab-content {
      display: none;
    }

    .tab-content.active {
      display: block;
    }

    /* =========================
       CONTEÚDO DAS SEÇÕES
    ========================= */

    .card-section {
      margin: 0 0 18px 0;
      padding: 0;
    }

    .card-section:last-child {
      margin-bottom: 0;
    }

    .card-section-title {
      display: flex;
      align-items: center;
      gap: 9px;
      font-size: 0.78rem;
      font-weight: 800;
      color: var(--text-highlight);
      text-transform: uppercase;
      letter-spacing: 0.08em;
      margin: 0 0 8px 0;
      padding: 0 0 8px 0;
      border-bottom: 1px solid var(--border-color);
    }

    .card-section-title::before {
      content: "";
      width: 5px;
      height: 22px;
      border-radius: 6px;
      background: var(--btn-primary);
      flex: 0 0 auto;
    }

    .card-text {
      display: block;
      margin: 0;
      padding: 0;
      font-size: 0.95rem;
      line-height: 1.5;
      color: var(--text-main);
      text-align: left;
    }

    /* Auditoria: objetivo e oportunidade sem espaços verticais excessivos */
    .tab-content .card-section .card-text {
      margin-top: 0 !important;
      padding-top: 0 !important;
      padding-bottom: 0 !important;
    }

    .tab-content .card-section {
      margin-top: 0 !important;
    }

    .tab-content .card-section-title + .card-text {
      margin-top: 0 !important;
    }

    .content-bullets {
      list-style: none;
      margin: 0;
      padding: 0;
      display: flex;
      flex-direction: column;
      gap: 10px;
    }

    .content-bullets li {
      position: relative;
      padding: 11px 14px 11px 35px;
      background: var(--bg-body);
      border: 1px solid var(--border-color);
      border-radius: 10px;
      line-height: 1.6;
    }

    .content-bullets li::before {
      content: "•";
      position: absolute;
      left: 15px;
      top: 8px;
      color: var(--text-highlight);
      font-size: 1.25rem;
      font-weight: 900;
    }

    .content-steps {
      list-style: none;
      counter-reset: solution-step;
      margin: 0;
      padding: 0;
      display: flex;
      flex-direction: column;
      gap: 10px;
    }

    .content-steps li {
      counter-increment: solution-step;
      position: relative;
      padding: 12px 14px 12px 48px;
      background: var(--bg-body);
      border: 1px solid var(--border-color);
      border-radius: 10px;
      line-height: 1.6;
    }

    .content-steps li::before {
      content: counter(solution-step);
      position: absolute;
      left: 12px;
      top: 11px;
      width: 25px;
      height: 25px;
      display: flex;
      align-items: center;
      justify-content: center;
      border-radius: 50%;
      background: var(--bg-tab-active);
      color: #fff;
      font-size: 0.75rem;
      font-weight: 800;
    }

    .empty-content {
      color: var(--text-muted);
      font-style: italic;
      padding: 12px 0;
    }

    /* =========================
       AUDITORIA
    ========================= */

    .audit-value.score {
      font-size: 1.15rem;
      color: var(--text-highlight);
    }

    .audit-verdict {
      display: inline-flex;
      align-items: center;
      width: fit-content;
      padding: 5px 10px;
      border-radius: 999px;
      font-size: 0.82rem;
      font-weight: 800;
      border: 1px solid var(--border-color);
      background: var(--bg-badge);
    }

    .audit-verdict.success {
      color: #22c55e;
    }

    .audit-verdict.partial {
      color: #f59e0b;
    }

    .audit-verdict.fail {
      color: #ef4444;
    }

    .audit-report {
      margin-top: 24px;
      padding-top: 22px;
      border-top: 1px solid var(--border-color);
    }

    .audit-report-header {
      display: flex;
      justify-content: space-between;
      align-items: center;
      gap: 12px;
      margin-bottom: 14px;
    }

    .audit-report-title {
      display: flex;
      align-items: center;
      gap: 9px;
      font-size: 0.78rem;
      font-weight: 800;
      color: var(--text-highlight);
      text-transform: uppercase;
      letter-spacing: 0.08em;
    }

    .audit-report-title::before {
      content: "";
      width: 5px;
      height: 22px;
      border-radius: 6px;
      background: var(--btn-primary);
    }

    .audit-report-content {
      background: var(--bg-body);
      border: 1px solid var(--border-color);
      border-radius: 14px;
      padding: 22px;
      line-height: 1.7;
      font-size: 0.9rem;
      overflow-x: auto;
    }

    .audit-report-content h1,
    .audit-report-content h2,
    .audit-report-content h3 {
      color: var(--text-highlight);
      line-height: 1.35;
    }

    .audit-report-content h1 {
      font-size: 1.25rem;
      margin: 0 0 16px;
    }

    .audit-report-content h2 {
      font-size: 1.05rem;
      margin: 28px 0 12px;
      padding-bottom: 8px;
      border-bottom: 1px solid var(--border-color);
    }

    .audit-report-content h3 {
      font-size: 0.95rem;
      margin: 20px 0 8px;
    }

    .audit-report-content p {
      margin: 0 0 14px;
    }

    .audit-report-content strong {
      font-weight: 800;
      color: var(--text-main);
    }

    .audit-report-content em {
      opacity: 0.9;
    }

    .audit-report-content ul,
    .audit-report-content ol {
      margin: 8px 0 16px;
      padding-left: 25px;
    }

    .audit-report-content li {
      margin: 6px 0;
    }

    .audit-report-content blockquote {
      margin: 14px 0;
      padding: 10px 14px;
      border-left: 3px solid var(--btn-primary);
      background: var(--bg-card);
      border-radius: 0 8px 8px 0;
    }

    .audit-report-content code {
      padding: 2px 5px;
      border-radius: 5px;
      background: var(--bg-card);
      border: 1px solid var(--border-color);
      font-family: Consolas, Monaco, monospace;
      font-size: 0.85em;
    }

    .audit-table-wrapper {
      width: 100%;
      overflow-x: auto;
      margin: 14px 0 22px;
    }

    .audit-table {
      width: 100%;
      min-width: 620px;
      border-collapse: collapse;
      font-size: 0.82rem;
    }

    .audit-table th,
    .audit-table td {
      border: 1px solid var(--border-color);
      padding: 9px 11px;
      text-align: left;
      vertical-align: top;
    }

    .audit-table th {
      background: var(--bg-card);
      color: var(--text-highlight);
      font-weight: 800;
    }

    .audit-table td {
      line-height: 1.55;
    }

    .audit-report-empty {
      color: var(--text-muted);
      font-style: italic;
    }

    .record-id {
      color: var(--text-muted);
      font-size: 0.72rem;
      margin-top: 4px;
    }

    .report-textarea {
      min-height: 260px !important;
      font-family: Consolas, Monaco, monospace !important;
      line-height: 1.5 !important;
    }

    .form-section-divider {
      margin: 26px 0 18px;
      padding-top: 16px;
      border-top: 1px solid var(--border-color);
      color: var(--text-highlight);
      font-size: 0.8rem;
      font-weight: 800;
      text-transform: uppercase;
      letter-spacing: 0.08em;
    }

    @media (max-width: 800px) {
      .audit-report-content {
        padding: 16px;
      }

      .content-bullets li,
      .content-steps li {
        padding-right: 11px;
      }
    }

    .audit-grid {
      display: grid;
      grid-template-columns: repeat(auto-fit, minmax(200px, 1fr));
      gap: 16px;
      margin-bottom: 16px;
    }

    .audit-item {
      background-color: var(--bg-body);
      border: 1px solid var(--border-color);
      padding: 12px 16px;
      border-radius: 12px;
    }

    .audit-label {
      font-size: 0.75rem;
      color: var(--text-muted);
      text-transform: uppercase;
      font-weight: 600;
      margin-bottom: 4px;
    }

    .audit-value {
      font-size: 0.95rem;
      font-weight: 600;
      color: var(--text-main);
    }

    .tags-container {
      display: flex;
      gap: 8px;
      flex-wrap: wrap;
      margin-top: 16px;
    }

    .tag {
      background-color: var(--bg-tag);
      color: var(--text-highlight);
      padding: 4px 10px;
      border-radius: 8px;
      font-size: 0.75rem;
      font-weight: 600;
    }

    .pagination {
      display: flex;
      justify-content: center;
      align-items: center;
      gap: 16px;
      margin-top: 36px;
    }

    .pagination button {
      background-color: var(--bg-card);
      border: 1px solid var(--border-color);
      color: var(--text-main);
      padding: 10px 20px;
      border-radius: 12px;
      cursor: pointer;
      font-weight: 600;
      box-shadow: 0 4px 12px var(--shadow-color);
    }

    .pagination button:disabled {
      opacity: 0.4;
      cursor: not-allowed;
    }

    .empty-message {
      text-align: center;
      padding: 60px 20px;
      color: var(--text-muted);
    }

    .modal-overlay {
      position: fixed;
      top: 0;
      left: 0;
      width: 100vw;
      height: 100vh;
      background: rgba(0, 0, 0, 0.6);
      backdrop-filter: blur(4px);
      display: none;
      justify-content: center;
      align-items: center;
      z-index: 1000;
    }

    .modal-overlay.active {
      display: flex;
    }

    .modal-content {
      background: var(--bg-card);
      border: 1px solid var(--border-color);
      border-radius: 20px;
      width: 90%;
      max-width: 700px;
      max-height: 90vh;
      overflow-y: auto;
      padding: 24px;
      box-shadow: 0 10px 30px rgba(0, 0, 0, 0.5);
    }

    .modal-header {
      display: flex;
      justify-content: space-between;
      align-items: center;
      margin-bottom: 20px;
    }

    .form-group {
      margin-bottom: 16px;
    }

    .form-group label {
      display: block;
      font-size: 0.8rem;
      font-weight: 600;
      color: var(--text-muted);
      margin-bottom: 6px;
      text-transform: uppercase;
    }

    .form-control {
      width: 100%;
      padding: 12px;
      background: var(--bg-input);
      border: 1px solid var(--border-color);
      border-radius: 10px;
      color: var(--text-main);
      font-size: 0.9rem;
      outline: none;
    }

    textarea.form-control {
      min-height: 80px;
      resize: vertical;
    }

    .modal-actions {
      display: flex;
      justify-content: flex-end;
      gap: 12px;
      margin-top: 24px;
    }

    .btn-save {
      background-color: var(--bg-tab-active);
      color: white;
      border: none;
      padding: 10px 20px;
      border-radius: 10px;
      cursor: pointer;
      font-weight: 600;
    }

    .btn-cancel {
      background: transparent;
      border: 1px solid var(--border-color);
      color: var(--text-muted);
      padding: 10px 20px;
      border-radius: 10px;
      cursor: pointer;
    }

    @media (max-width: 800px) {
      body {
        padding: 12px;
      }

      .header {
        flex-direction: column;
        align-items: flex-start;
        gap: 16px;
      }

      .header-actions {
        width: 100%;
        flex-wrap: wrap;
      }

      .card-header {
        flex-direction: column;
      }

      .card-header-actions {
        width: 100%;
        flex-wrap: wrap;
      }
    }
  
    /* =========================
       AJUSTE FINAL DE ESPAÇAMENTO
       Objetivo / Oportunidade PS
    ========================= */

    .tab-content.active > .card-section {
      margin-top: 0 !important;
      margin-bottom: 18px !important;
      padding-top: 0 !important;
      padding-bottom: 0 !important;
    }

    .tab-content.active > .card-section .card-section-title {
      margin-top: 0 !important;
      margin-bottom: 8px !important;
    }

    .tab-content.active > .card-section .card-text {
      margin-top: 0 !important;
      padding-top: 0 !important;
      line-height: 1.5 !important;
    }

    .tab-content.active > .card-section .card-text > *:first-child {
      margin-top: 0 !important;
    }

    .tab-content.active > .card-section .card-text > *:last-child {
      margin-bottom: 0 !important;
    }

</style>
</head>

<body>

  <header class="header">

    <div class="title-container">
      <span class="logo-icon"></span>
      <h1>SaveInCloud — Knowledge Base & Quality Audit</h1>
    </div>

    <div class="header-actions">

      <div id="status-loading" class="status-loading">
        Carregando registros...
      </div>

      <button class="btn-new" onclick="openCreateModal()">
        + Novo Registro
      </button>

      <button id="theme-toggle" class="theme-toggle-btn">
        <span id="theme-icon">🌙</span>
        <span id="theme-text">Escuro</span>
      </button>

    </div>
  </header>

  <main>

    <section class="search-container">

      <input
        type="text"
        id="search-input"
        class="search-input"
        placeholder="Pesquisar por título, problema, solução, atendente, categoria ou tags..."
        autocomplete="off"
      >

    </section>

    <section id="cards-container" class="cards-grid"></section>

    <nav class="pagination">

      <button id="btn-prev" disabled>
        Anterior
      </button>

      <span
        id="page-info"
        style="font-size: 0.9rem; color: var(--text-muted);"
      >
        Página 1
      </span>

      <button id="btn-next" disabled>
        Próxima
      </button>

    </nav>

  </main>

  <!-- MODAL -->

  <div id="modal-form" class="modal-overlay">

    <div class="modal-content">

      <div class="modal-header">

        <h3
          id="modal-title"
          style="color: var(--text-highlight);"
        >
          Novo Registro
        </h3>

        <button
          class="btn-action"
          onclick="closeModal()"
          type="button"
        >
          ✕
        </button>

      </div>

      <form
        id="form-registro"
        onsubmit="salvarRegistro(event)"
      >

        <input type="hidden" id="edit-id">

        <div class="form-group">
          <label>Título *</label>

          <input
            type="text"
            id="edit-titulo"
            class="form-control"
            required
          >
        </div>

        <div class="form-group">
          <label>Categoria</label>

          <input
            type="text"
            id="edit-categoria"
            class="form-control"
          >
        </div>

        <div class="form-group">
          <label>Tags (separadas por vírgula)</label>

          <input
            type="text"
            id="edit-tags"
            class="form-control"
          >
        </div>

        <div class="form-group">
          <label>Descrição / Problema</label>

          <textarea
            id="edit-descricao"
            class="form-control"
          ></textarea>
        </div>

        <div class="form-group">
          <label>Solução *</label>

          <textarea
            id="edit-solucao"
            class="form-control"
            required
          ></textarea>
        </div>

        <div class="form-group">
          <label>Nota Final</label>

          <input
            type="number"
            step="0.1"
            id="edit-nota"
            class="form-control"
          >
        </div>

        <div class="form-group">
          <label>Veredito</label>

          <input
            type="text"
            id="edit-veredito"
            class="form-control"
          >
        </div>

        <div class="form-group">
          <label>Objetivo</label>

          <textarea
            id="edit-objetivo"
            class="form-control"
          ></textarea>
        </div>

        <div class="form-group">
          <label>Oportunidade PS</label>

          <textarea
            id="edit-oportunidade"
            class="form-control"
          ></textarea>
        </div>

        <div class="form-section-divider">
          Relatório completo da auditoria
        </div>

        <div class="form-group">
          <label>Relatório completo da auditoria (Markdown)</label>

          <textarea
            id="edit-relatorio"
            class="form-control report-textarea"

    let currentPage = 1;

    const cardsContainer =

    const statusLoading =

    /* =========================
       TEMA
    ========================= */

    function initTheme() {

      const savedTheme =
        localStorage.getItem('kb_theme') || 'dark';

      document.documentElement.setAttribute(
        'data-theme',
        savedTheme
      );

      updateThemeUI(savedTheme);
    }


    function updateThemeUI(theme) {

      themeIcon.innerText =
        theme === 'light' ? '☀️' : '🌙';

      themeText.innerText =
        theme === 'light' ? 'Claro' : 'Escuro';
    }


    themeToggleBtn.addEventListener('click', () => {

          ? 'light'

    /* =========================
       CARREGAR REGISTROS
    ========================= */

    async function carregarRegistros(
      busca = '',
      pagina = 1
    ) {

      statusLoading.innerText =
        'Carregando registros...';

      try {

        const url =
          `./api.php?action=read` +
          `&search=${encodeURIComponent(busca)}` +
          `&page=${encodeURIComponent(pagina)}` +
          `&limit=10` +
          `&_=${Date.now()}`;

        const response =
          await fetch(url, {
            method: 'GET',
            cache: 'no-store'
          });

        if (!response.ok) {

          throw new Error(
            `Erro HTTP: ${response.status}`
          );
        }

        const json =
          await response.json();

        if (
          json.success === false &&
          json.error
        ) {

          throw new Error(json.error);
        }

        registrosCache =
          Array.isArray(json.data)
            ? json.data
            : Array.isArray(json)
              ? json
              : [];

        const totalPaginas =
          Number(json.total_pages || 1);

        renderizarCards(registrosCache);

        atualizarPaginacao(
          pagina,
          totalPaginas
        );

        statusLoading.innerText = '';

      } catch (error) {

        console.error(
          'Erro ao buscar dados:',
          error
        );

        statusLoading.innerText =
          'Erro ao carregar registros.';

        cardsContainer.innerHTML =
          '<div class="empty-message">' +
          'Erro ao conectar com a API. ' +
          'Verifique o console.' +
          '</div>';
      }
    }


    /* =========================
       RENDERIZAR CARDS
    ========================= */

    function formatarMarkdownInline(texto) {

      let resultado = escapeHtml(texto);

      resultado = resultado.replace(
        /`([^`]+)`/g,
        '<code>$1</code>'
      );

      resultado = resultado.replace(
        /\*\*([^*]+)\*\*/g,
        '<strong>$1</strong>'
      );

      resultado = resultado.replace(
        /(?<!\*)\*([^*]+)\*(?!\*)/g,
        '<em>$1</em>'
      );

      return resultado;
    }


    function ehLinhaTabela(linha) {
      return /^\s*\|.*\|\s*$/.test(linha);
    }


    function ehSeparadorTabela(linha) {
      return /^\s*\|?\s*:?-+:?\s*(\|\s*:?-+:?\s*)+\|?\s*$/.test(linha);
    }


    function renderizarTabelaMarkdown(linhas) {

      if (linhas.length < 2) {
        return '';
      }

      const cabecalho =
        linhas[0]
          .trim()
          .replace(/^\|/, '')
          .replace(/\|$/, '')
          .split('|')
          .map(c => c.trim());

      let htmlTabela = `
        <div class="audit-table-wrapper">
          <table class="audit-table">
            <thead>
              <tr>
      `;

      for (const coluna of cabecalho) {
        htmlTabela += `
          <th>${formatarMarkdownInline(coluna)}</th>
        `;
      }

      htmlTabela += `
              </tr>
            </thead>
            <tbody>
      `;

      for (let i = 2; i < linhas.length; i++) {

        const colunas =
          linhas[i]
            .trim()
            .replace(/^\|/, '')
            .replace(/\|$/, '')
            .split('|')
            .map(c => c.trim());

        htmlTabela += '<tr>';

        for (let j = 0; j < cabecalho.length; j++) {

          htmlTabela += `
            <td>${formatarMarkdownInline(
              colunas[j] || ''
            )}</td>
          `;
        }

        htmlTabela += '</tr>';
      }

      htmlTabela += `
            </tbody>
          </table>
        </div>
      `;

      return htmlTabela;
    }


    function renderizarMarkdown(markdown) {

      if (!markdown || !String(markdown).trim()) {
        return `
          <div class="audit-report-empty">
            Nenhum relatório de auditoria disponível.
          </div>
        `;
      }

      const linhas =
        String(markdown)
          .replace(/\r\n/g, '\n')
          .split('\n');

      let html = '';
      let i = 0;
      let paragrafo = [];
      let listaAtual = null;


      function fecharParagrafo() {

        if (paragrafo.length === 0) {
          return;
        }

        const texto =
          paragrafo
            .join(' ')
            .trim();

        if (texto) {
          html += `
            <p>
              ${formatarMarkdownInline(texto)}
            </p>
          `;
        }

        paragrafo = [];
      }


      function fecharLista() {

        if (listaAtual) {
          html += `</${listaAtual}>`;
          listaAtual = null;
        }
      }


      while (i < linhas.length) {

        const linha = linhas[i];


        if (!linha.trim()) {

          fecharParagrafo();
          fecharLista();

          i++;
          continue;
        }


        // Tabela Markdown
        if (
          ehLinhaTabela(linha) &&
          i + 1 < linhas.length &&
          ehSeparadorTabela(linhas[i + 1])
        ) {

          fecharParagrafo();
          fecharLista();

          const tabela = [
            linhas[i],
            linhas[i + 1]
          ];

          i += 2;

          while (
            i < linhas.length &&
            ehLinhaTabela(linhas[i])
          ) {
            tabela.push(linhas[i]);
            i++;
          }

          html += renderizarTabelaMarkdown(tabela);

          continue;
        }


        // H1
        let match =
          linha.match(/^#\s+(.+)$/);

        if (match) {

          fecharParagrafo();
          fecharLista();

          html += `
            <h1>${formatarMarkdownInline(match[1])}</h1>
          `;

          i++;
          continue;
        }


        // H2
        match =
          linha.match(/^##\s+(.+)$/);

        if (match) {

          fecharParagrafo();
          fecharLista();

          html += `
            <h2>${formatarMarkdownInline(match[1])}</h2>
          `;

          i++;
          continue;
        }


        // H3
        match =
          linha.match(/^###\s+(.+)$/);

        if (match) {

          fecharParagrafo();
          fecharLista();

          html += `
            <h3>${formatarMarkdownInline(match[1])}</h3>
          `;

          i++;
          continue;
        }


        // Lista não ordenada
        match =
          linha.match(/^\s*[-*]\s+(.+)$/);

        if (match) {

          fecharParagrafo();

          if (listaAtual !== 'ul') {

            fecharLista();

            html += '<ul>';
            listaAtual = 'ul';
          }

          html += `
            <li>
              ${formatarMarkdownInline(match[1])}
            </li>
          `;

          i++;
          continue;
        }


        // Lista ordenada
        match =
          linha.match(/^\s*\d+\.\s+(.+)$/);

        if (match) {

          fecharParagrafo();

          if (listaAtual !== 'ol') {

            fecharLista();

            html += '<ol>';
            listaAtual = 'ol';
          }

          html += `
            <li>
              ${formatarMarkdownInline(match[1])}
            </li>
          `;

          i++;
          continue;
        }


        // Blockquote
        match =
          linha.match(/^\s*>\s*(.+)$/);

        if (match) {

          fecharParagrafo();
          fecharLista();

          html += `
            <blockquote>
              ${formatarMarkdownInline(match[1])}
            </blockquote>
          `;

          i++;
          continue;
        }


        fecharLista();

        paragrafo.push(linha.trim());

        i++;
      }


      fecharParagrafo();
      fecharLista();

      return html;
    }


    function normalizarLinhas(texto) {
      return String(texto ?? '')
        .replace(/\r\n/g, '\n')
        .split('\n')
        .map(linha => linha.trim())
        .filter(Boolean);
    }


    function renderizarConteudoTopicos(texto, tipo = 'bullet') {

      if (!texto || !String(texto).trim()) {
        return `
          <div class="empty-content">
            Não informado no atendimento.
          </div>
        `;
      }

      const linhas = normalizarLinhas(texto);

      // Se o conteúdo já vier como lista, preserva os itens.
      const itensExistentes = linhas.filter(linha =>
        /^[-*•]\s+/.test(linha) ||
        /^\d+[\.\)]\s+/.test(linha)
      );

      if (itensExistentes.length === linhas.length && linhas.length > 0) {

        if (tipo === 'steps' || /^\d+[\.\)]/.test(linhas[0])) {
          return `
            <ol class="content-steps">
              ${linhas.map(item => `
                <li>${escapeHtml(
                  item.replace(/^\d+[\.\)]\s+/, '')
                      .replace(/^[-*•]\s+/, '')
                )}</li>
              `).join('')}
            </ol>
          `;
        }

        return `
          <ul class="content-bullets">
            ${linhas.map(item => `
              <li>${escapeHtml(
                item.replace(/^[-*•]\s+/, '')
              )}</li>
            `).join('')}
          </ul>
        `;
      }

      // Quando a IA devolve um único parágrafo,
      // transforma as frases em tópicos sem alterar o conteúdo.
      const frases = String(texto)
        .replace(/\s+/g, ' ')
        .trim()
        .match(/[^.!?]+(?:[.!?]+|$)/g)
        ?.map(frase => frase.trim())
        .filter(Boolean) || [];

      if (frases.length >= 2) {

        return `
          <ul class="content-bullets">
            ${frases.map(frase => `
              <li>${escapeHtml(frase)}</li>
            `).join('')}
          </ul>
        `;
      }

      return `
        <ul class="content-bullets">
          <li>${escapeHtml(String(texto).trim())}</li>
        </ul>
      `;
    }


    function obterClasseVeredito(veredito) {

      const texto = String(veredito || '').toLowerCase();

      if (
        texto.includes('exitoso') &&
        !texto.includes('parcial')
      ) {
        return 'success';
      }

      if (texto.includes('parcial')) {
        return 'partial';
      }

      if (
        texto.includes('não exitoso') ||
        texto.includes('nao exitoso') ||
        texto.includes('falha')
      ) {
        return 'fail';
      }

      return '';
    }


    function renderizarCards(registros) {

      if (!registros || registros.length === 0) {

        cardsContainer.innerHTML =
          '<div class="empty-message">' +
          'Nenhum registro encontrado.' +
          '</div>';

        return;
      }


      cardsContainer.innerHTML =
        registros.map(item => {

            item.categoria || 'Geral';

          const tagsArray =
            item.tags
              ? String(item.tags)
                  .split(',')
                  .map(t => t.trim())
                  .filter(Boolean)
              : [];

          const problemaDescricao =
            item.descricao ||
            item.problema ||
            '';

          const notaFinal =
            item.nota_final !== null &&
            item.nota_final !== undefined
              ? item.nota_final
              : item.nota;

          const oportunidade =
            item.oportunidade_ps ||
            item.oportunidade ||
            '';

          const veredito =
            item.veredito ||
            'Não avaliado';

          const id =
            Number(item.id);

          const classeVeredito =
            obterClasseVeredito(veredito);

          const relatorio =
            item.relatorio_markdown ||
            '';


          return `
            <article class="card">

              <header class="card-header">

                <div>
                  <h2 class="card-title">
                    ${escapeHtml(
                      item.titulo || 'Sem Título'
                    )}
                  </h2>

                  <div class="record-id">
                    Registro #${escapeHtml(id)}
                  </div>
                </div>


                <div class="card-header-actions">

                  <span class="badge">
                    ${escapeHtml(categoria)}
                  </span>

                  <button
                    class="btn-action btn-edit"
                    onclick="openEditModal(${id})"
                    type="button"
                  >
                    ✎ Editar
                  </button>

                  <button
                    class="btn-action btn-delete"
                    onclick="excluirRegistro(${id})"
                    type="button"
                  >
                    🗑 Excluir
                  </button>

                </div>

              </header>


              <div class="card-tabs">

                <button
                  class="tab-btn active"
                  onclick="switchTab(
                    this,
                    'tab-solucao-${id}'
                  )"
                  type="button"
                >
                  Solução KB
                </button>


                <button
                  class="tab-btn"
                  onclick="switchTab(
                    this,
                    'tab-qualidade-${id}'
                  )"
                  type="button"
                >
                  Auditoria de Qualidade
                </button>

              </div>


              <!-- =========================
                   ABA SOLUÇÃO
              ========================== -->

              <div
                id="tab-solucao-${id}"
                class="tab-content active"
              >

                ${
                  problemaDescricao
                    ? `
                      <div class="card-section">

                        <div class="card-section-title">
                          Descrição / Problema
                        </div>

                        <div class="card-text">
                          ${renderizarConteudoTopicos(
                            problemaDescricao,
                            'bullet'
                          )}
                        </div>

                      </div>
                    `
                    : ''
                }


                ${
                  item.solucao
                    ? `
                      <div class="card-section">

                        <div class="card-section-title">
                          Solução
                        </div>

                        <div class="card-text">
                          ${renderizarConteudoTopicos(
                            item.solucao,
                            'steps'
                          )}
                        </div>

                      </div>
                    `
                    : ''
                }

              </div>


              <!-- =========================
                   ABA AUDITORIA
              ========================== -->

              <div
                id="tab-qualidade-${id}"
                class="tab-content"
              >

                <div class="audit-grid">

                  <div class="audit-item">

                    <div class="audit-label">
                      Nota Final
                    </div>

                    <div class="audit-value score">
                      ${
                        notaFinal !== null &&
                        notaFinal !== undefined &&
                        notaFinal !== ''
                          ? escapeHtml(
                              `${notaFinal} / 5,0`
                            )
                          : 'N/A'
                      }
                    </div>

                  </div>


                  <div class="audit-item">

                    <div class="audit-label">
                      Veredito
                    </div>

                    <div class="audit-value">

                      <span class="audit-verdict ${classeVeredito}">
                        ${escapeHtml(veredito)}
                      </span>

                    </div>

                  </div>

                </div>


                ${
                  item.objetivo
                    ? `
                      <div class="card-section">

                        <div class="card-section-title">
                          Objetivo
                        </div>

                        <div class="card-text">
                          ${escapeHtml(
                            item.objetivo
                          )}
                        </div>

                      </div>
                    `
                    : ''
                }


                ${
                  oportunidade
                    ? `
                      <div class="card-section">

                        <div class="card-section-title">
                          Oportunidade PS
                        </div>

                        <div class="card-text">
                          ${escapeHtml(
                            oportunidade
                          )}
                        </div>

                      </div>
                    `
                    : ''
                }


                <div class="audit-report">

                  <div class="audit-report-header">

                    <div class="audit-report-title">
                      Relatório completo da auditoria
                    </div>

                  </div>

                  <div class="audit-report-content">

                    ${
                      relatorio
                        ? renderizarMarkdown(relatorio)
                        : `
                          <div class="audit-report-empty">
                            Nenhum relatório de auditoria disponível.
                          </div>
                        `
                    }

                  </div>

                </div>

              </div>


              ${
                tagsArray.length > 0
                  ? `
                    <footer class="tags-container">

                      ${tagsArray
                        .map(
                          tag =>
                            `<span class="tag">${escapeHtml(
                              tag
                            )}</span>`
                        )
                        .join('')}

                    </footer>
                  `
                  : ''
              }

            </article>
          `;

        }).join('');
    }

       NOVO REGISTRO

      document
        .getElementById('modal-form')
        .classList.remove('active');
    }


    /* =========================
       SALVAR
    ========================= */

    async function salvarRegistro(event) {

      event.preventDefault();

      statusLoading.innerText =
        'Salvando...';


      const id =
        document
          .getElementById('edit-id')
          .value
          .trim();

      const isEdit =
        Boolean(id);


      const payload = {

        titulo:
          document
            .getElementById('edit-titulo')
            .value
            .trim(),

        solucao:
          document
            .getElementById('edit-solucao')
            .value
            .trim(),

        categoria:
          document
            .getElementById('edit-categoria')
            .value
            .trim(),

        tags:
          document
            .getElementById('edit-tags')
            .value
            .trim(),

        descricao:
          document
            .getElementById('edit-descricao')
            .value
            .trim(),

        problema:
          document
            .getElementById('edit-descricao')
            .value
            .trim(),

        nota_final:
          document
            .getElementById('edit-nota')
            .value
            ? parseFloat(
                document
                  .getElementById('edit-nota')
                  .value
              )
            : null,

        veredito:
          document
            .getElementById('edit-veredito')
            .value
            .trim(),

        objetivo:
          document
            .getElementById('edit-objetivo')
            .value
            .trim(),

        oportunidade_ps:
          document
            .getElementById('edit-oportunidade')
            .value
            .trim(),

        relatorio_markdown:
          document
            .getElementById('edit-relatorio')
            .value
            .trim()
      };


      if (isEdit) {

        payload.id =
          parseInt(id, 10);
      }


      const action =
        isEdit
          ? 'update'
          : 'create';


      try {

        const response =
          await fetch(
            `./api.php?action=${action}&_=${Date.now()}`,
            {
              method: 'POST',

              cache: 'no-store',

              headers: {
                'Content-Type':
                  'application/json',
                'Cache-Control':
                  'no-cache'
              },

              body:
                JSON.stringify(payload)
            }
          );


        const res =
          await response.json();


        console.log(
          'Resposta ao salvar:',
          res
        );


        if (res.success) {

          closeModal();

          await carregarRegistros(
            currentSearch,
            isEdit
              ? currentPage
              : 1
          );

        } else {

          alert(
            'Erro ao salvar: ' +
            (
              res.error ||
              res.message ||
              'Erro desconhecido'
            )
          );
        }

      } catch (err) {

        console.error(
          'Erro ao gravar:',
          err
        );

        alert(
          'Erro ao se conectar com a API.'
        );

      } finally {

        statusLoading.innerText = '';
      }
    }


    /* =========================
       EXCLUIR
    ========================= */

    async function excluirRegistro(id) {

      const registroId =
        parseInt(id, 10);


      if (
        !Number.isInteger(registroId) ||
        registroId <= 0
      ) {

        alert(
          'ID do registro inválido.'
        );

        return;
      }


      const item =
        registrosCache.find(
          r => Number(r.id) === registroId
        );


      const titulo =
        item?.titulo
          ? `\n\nTítulo: ${item.titulo}`
          : '';


      const confirmou =
        confirm(
          'Tem certeza que deseja excluir este registro permanentemente?' +
          titulo
        );


      if (!confirmou) {
        return;
      }


      statusLoading.innerText =
        'Excluindo...';


      try {

        /*
         * IMPORTANTE:
         * A exclusão é enviada explicitamente
         * como action=delete e com o ID.
         */

        const url =
          `./api.php?action=delete` +
          `&id=${encodeURIComponent(registroId)}` +
          `&_=${Date.now()}`;


        console.log(
          'Excluindo registro:',
          {
            id: registroId,
            url: url
          }
        );


        const response =
          await fetch(
            url,
            {
              method: 'POST',

              cache: 'no-store',

              headers: {
                'Content-Type':
                  'application/json',

                'Cache-Control':
                  'no-cache',

                'Pragma':
                  'no-cache'
              },

              body:
                JSON.stringify({
                  id: registroId
                })
            }
          );


        if (!response.ok) {

          throw new Error(
            `Erro HTTP ${response.status}`
          );
        }


        const res =
          await response.json();


        console.log(
          'Resposta da exclusão:',
          res
        );


        if (res.success) {

          alert(
            'Registro excluído com sucesso.'
          );


          /*
           * Se a página atual ficar vazia
           * depois da exclusão, voltamos uma página.
           */

          if (
            registrosCache.length === 1 &&
            currentPage > 1
          ) {

            await carregarRegistros(
              currentSearch,
              currentPage - 1
            );

          } else {

            await carregarRegistros(
              currentSearch,
              currentPage
            );
          }

        } else {

          alert(
            'Erro ao excluir: ' +
            (
              res.error ||
              res.message ||
              'Erro desconhecido'
            )
          );
        }


      } catch (err) {

        console.error(
          'Erro ao excluir:',
          err
        );

        alert(
          'Erro ao se conectar com a API.\n\n' +
          err.message
        );

      } finally {

        statusLoading.innerText = '';
      }
    }


    /* =========================
       ABAS
    ========================= */

    function switchTab(
      btnElement,
      tabId
    ) {

      const card =
        btnElement.closest('.card');

      card
        .querySelectorAll('.tab-btn')
        .forEach(btn =>
          btn.classList.remove('active')
        );

      card
        .querySelectorAll('.tab-content')
        .forEach(content =>
          content.classList.remove('active')
        );


      btnElement.classList.add('active');

      const tab =
        document.getElementById(tabId);

      if (tab) {
        tab.classList.add('active');
      }
    }


    /* =========================
       PAGINAÇÃO
    ========================= */

    function atualizarPaginacao(
      paginaAtual,
      totalPaginas
    ) {

      currentPage =
        Number(paginaAtual) || 1;

      totalPaginas =
        Math.max(
          1,
          Number(totalPaginas) || 1
        );


      pageInfo.innerText =
        `Página ${currentPage} de ${totalPaginas}`;


      btnPrev.disabled =
        currentPage <= 1;

      btnNext.disabled =
        currentPage >= totalPaginas;
    }


    /* =========================
       SEGURANÇA HTML
    ========================= */

    function escapeHtml(value) {

      return String(value ?? '')
        .replace(/&/g, '&amp;')
        .replace(/</g, '&lt;')
        .replace(/>/g, '&gt;')
        .replace(/"/g, '&quot;')
        .replace(/'/g, '&#039;');
    }


    /* =========================
       PESQUISA
    ========================= */

    searchInput.addEventListener(
      'input',
      (e) => {

        clearTimeout(
          debounceTimer
        );


        currentSearch =
          e.target.value.trim();


        debounceTimer =
          setTimeout(
            () => {
              carregarRegistros(
                currentSearch,
                1
              );
            },
            300
          );
      }
    );


    /* =========================
       PAGINAÇÃO
    ========================= */

    btnPrev.addEventListener(
      'click',
      () => {

        if (currentPage > 1) {

          carregarRegistros(
            currentSearch,
            currentPage - 1
          );
        }
      }
    );


    btnNext.addEventListener(
      'click',
      () => {

        carregarRegistros(
          currentSearch,
          currentPage + 1
        );
      }
    );


    /* =========================
       INICIALIZAÇÃO
    ========================= */

    document.addEventListener(
      'DOMContentLoaded',
      () => {

        initTheme();

        carregarRegistros(
          '',
          1
        );
      }
    );

  </script>

</body>
</html>
