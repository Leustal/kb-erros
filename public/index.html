<!DOCTYPE html>
<html lang="pt-BR" data-theme="dark">

<head>

  <meta charset="UTF-8">

  <meta
    name="viewport"
    content="width=device-width, initial-scale=1.0"
  >

  <title>SaveInCloud - KB & Quality Audit</title>

  <link
    rel="icon"
    href='data:image/svg+xml,<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 100 100"><text y=".9em" font-size="90">🧠</text></svg>'
  >

  <style>

    :root {
      --bg-body: #0b0f19;
      --bg-card: #151d30;
      --bg-input: #1b253d;
      --bg-tag: #0284c720;
      --bg-badge: #0f172a;
      --bg-tab-active: #06b6d4;
      --border-color: #24314d;
      --text-main: #f8fafc;
      --text-muted: #94a3b8;
      --text-highlight: #38bdf8;
      --shadow-color: rgba(0, 0, 0, 0.35);
      --btn-danger: #ef4444;
      --btn-warning: #f59e0b;
      --btn-primary: #06b6d4;
    }

    [data-theme="light"] {
      --bg-body: #f1f5f9;
      --bg-card: #ffffff;
      --bg-input: #ffffff;
      --bg-tag: #e0f2fe;
      --bg-badge: #e2e8f0;
      --bg-tab-active: #0284c7;
      --border-color: #cbd5e1;
      --text-main: #0f172a;
      --text-muted: #64748b;
      --text-highlight: #0284c7;
      --shadow-color: rgba(0, 0, 0, 0.05);
      --btn-danger: #dc2626;
      --btn-warning: #d97706;
      --btn-primary: #0284c7;
    }

    * {
      box-sizing: border-box;
      margin: 0;
      padding: 0;

      font-family:
        -apple-system,
        BlinkMacSystemFont,
        "Segoe UI",
        Roboto,
        Helvetica,
        Arial,
        sans-serif;

      transition:
        background-color 0.25s ease,
        border-color 0.25s ease,
        color 0.25s ease;
    }

    body {
      background-color: var(--bg-body);
      color: var(--text-main);

      padding: 24px;

      max-width: 1200px;
      margin: 0 auto;
    }

    .header {
      display: flex;

      justify-content: space-between;
      align-items: center;

      margin-bottom: 24px;
      padding-bottom: 16px;

      border-bottom: 1px solid var(--border-color);
    }

    .title-container {
      display: flex;
      align-items: center;
      gap: 12px;
    }

    .title-container h1 {
      font-size: 1.4rem;
      font-weight: 700;
      color: var(--text-main);
    }

    .logo-icon {
      width: 24px;
      height: 24px;

      background-color: #06b6d4;

      border-radius: 50%;

      box-shadow: 0 0 12px #06b6d480;
    }

    .header-actions {
      display: flex;
      align-items: center;
      gap: 12px;
    }

    .btn-new {
      background-color: var(--btn-primary);
      color: #ffffff;

      border: none;

      padding: 8px 16px;

      border-radius: 20px;

      cursor: pointer;

      font-size: 0.85rem;
      font-weight: 600;

      box-shadow:
        0 4px 12px var(--shadow-color);
    }

    .btn-new:hover {
      opacity: 0.9;
    }

    .theme-toggle-btn {
      background: var(--bg-card);

      border: 1px solid var(--border-color);

      color: var(--text-main);

      padding: 8px 14px;

      border-radius: 20px;

      cursor: pointer;

      font-size: 0.85rem;
      font-weight: 600;

      display: flex;
      align-items: center;

      gap: 6px;

      box-shadow:
        0 4px 12px var(--shadow-color);
    }

    .status-loading {
      font-size: 0.85rem;
      color: var(--text-muted);
    }

    .search-container {
      margin-bottom: 24px;
    }

    .search-input {
      width: 100%;

      padding: 16px 20px;

      background-color: var(--bg-input);

      border: 1px solid var(--border-color);

      border-radius: 16px;

      color: var(--text-main);

      font-size: 0.95rem;

      outline: none;

      box-shadow:
        0 6px 16px var(--shadow-color);
    }

    .search-input:focus {
      border-color: var(--text-highlight);
    }

    .cards-grid {
      display: flex;
      flex-direction: column;

      gap: 20px;
    }

    .card {
      background-color: var(--bg-card);

      border: 1px solid var(--border-color);

      border-radius: 20px;

      padding: 24px;

      box-shadow:
        0 8px 24px var(--shadow-color);
    }

    .card-header {
      display: flex;

      justify-content: space-between;
      align-items: flex-start;

      margin-bottom: 16px;

      gap: 12px;
    }

    .card-title {
      font-size: 1.15rem;

      font-weight: 700;

      color: var(--text-highlight);

      line-height: 1.4;
    }

    .card-header-actions {
      display: flex;
      align-items: center;

      gap: 8px;
    }

    .badge {
      background-color: var(--bg-badge);

      color: var(--text-muted);

      padding: 6px 12px;

      border-radius: 12px;

      font-size: 0.75rem;
      font-weight: 600;

      border: 1px solid var(--border-color);

      white-space: nowrap;
    }

    .btn-action {
      background: transparent;

      border: 1px solid var(--border-color);

      color: var(--text-main);

      padding: 6px 10px;

      border-radius: 10px;

      cursor: pointer;

      font-size: 0.75rem;
      font-weight: 600;
    }

    .btn-action:hover {
      border-color: var(--text-highlight);
    }

    .btn-edit {
      color: var(--btn-warning);
    }

    .btn-delete {
      color: var(--btn-danger);
    }

    .card-tabs {
      display: flex;

      gap: 8px;

      margin-bottom: 20px;

      padding: 6px;

      background: var(--bg-input);

      border: 1px solid var(--border-color);

      border-radius: 14px;
    }

    .tab-btn {
      background: transparent;

      border: none;

      color: var(--text-muted);

      padding: 8px 16px;

      border-radius: 10px;

      font-size: 0.85rem;
      font-weight: 600;

      cursor: pointer;
    }

    .tab-btn.active {
      background-color: var(--bg-tab-active);

      color: #ffffff;
    }

    .tab-content {
      display: none;
    }

    .tab-content.active {
      display: block;
    }

    .card-section {
      margin-bottom: 18px;

      padding: 18px 20px;

      background: var(--bg-input);

      border: 1px solid var(--border-color);

      border-radius: 14px;

      box-shadow:
        inset 0 1px 0 rgba(255, 255, 255, 0.02);
    }

    .card-section:last-child {
      margin-bottom: 0;
    }

    .card-section-title {
      display: flex;

      align-items: center;

      gap: 10px;

      font-size: 0.78rem;

      font-weight: 700;

      color: var(--text-highlight);

      text-transform: uppercase;

      letter-spacing: 0.08em;

      margin-bottom: 12px;

      padding-bottom: 10px;

      border-bottom: 1px solid var(--border-color);
    }

    .card-section-title::before {
      content: "";

      width: 4px;
      height: 16px;

      border-radius: 4px;

      background: var(--btn-primary);

      flex-shrink: 0;
    }

    .card-text {
      font-size: 0.95rem;

      line-height: 1.65;

      color: var(--text-main);

      white-space: pre-wrap;
    }

    .card-section .card-text {
      padding: 2px 0;
    }

    .card-section .card-text p {
      margin: 0 0 8px;
    }

    .card-section .card-text p:last-child {
      margin-bottom: 0;
    }

    /* =========================================================
       AUDITORIA
    ========================================================= */

    .audit-grid {
      display: grid;

      grid-template-columns:
        repeat(auto-fit, minmax(200px, 1fr));

      gap: 16px;

      margin-bottom: 16px;
    }

    .audit-item {
      background-color: var(--bg-body);

      border: 1px solid var(--border-color);

      padding: 12px 16px;

      border-radius: 12px;
    }

    .audit-label {
      font-size: 0.75rem;

      color: var(--text-muted);

      text-transform: uppercase;

      font-weight: 600;

      margin-bottom: 4px;
    }

    .audit-value {
      font-size: 0.95rem;

      font-weight: 600;

      color: var(--text-main);

      line-height: 1.5;
    }

    .audit-score {
      color: var(--text-highlight);

      font-size: 1.15rem;

      font-weight: 700;
    }

    .audit-report {
      margin-top: 18px;
    }

    .audit-report-content {
      color: var(--text-main);

      font-size: 0.92rem;

      line-height: 1.7;

      overflow-wrap: anywhere;
    }

    .audit-report-content h1,
    .audit-report-content h2,
    .audit-report-content h3 {
      color: var(--text-highlight);

      margin-top: 22px;

      margin-bottom: 12px;

      line-height: 1.35;
    }

    .audit-report-content h1 {
      font-size: 1.25rem;
    }

    .audit-report-content h2 {
      font-size: 1.1rem;
    }

    .audit-report-content h3 {
      font-size: 1rem;
    }

    .audit-report-content p {
      margin-bottom: 12px;
    }

    .audit-report-content ul,
    .audit-report-content ol {
      margin:

        8px 0 14px 24px;
    }

    .audit-report-content li {
      margin-bottom: 6px;
    }

    .audit-report-content blockquote {
      margin: 12px 0;

      padding: 10px 14px;

      border-left: 3px solid var(--btn-primary);

      background: var(--bg-body);

      color: var(--text-muted);

      border-radius: 8px;
    }

    .audit-report-content code {
      background: var(--bg-body);

      border: 1px solid var(--border-color);

      padding: 2px 6px;

      border-radius: 6px;

      font-family:
        Consolas,
        Monaco,
        monospace;

      font-size: 0.85em;
    }

    .audit-report-content pre {
      background: var(--bg-body);

      border: 1px solid var(--border-color);

      padding: 14px;

      border-radius: 10px;

      overflow-x: auto;

      margin: 12px 0;
    }

    .audit-report-content pre code {
      background: transparent;

      border: none;

      padding: 0;
    }

    .audit-report-content strong {
      color: var(--text-main);

      font-weight: 700;
    }

    .audit-report-content em {
      color: var(--text-highlight);
    }

    .audit-report-content hr {
      border: none;

      border-top:
        1px solid var(--border-color);

      margin: 20px 0;
    }

    .audit-report-content table {
      width: 100%;

      border-collapse: collapse;

      margin: 14px 0 20px;

      display: block;

      overflow-x: auto;
    }

    .audit-report-content th,
    .audit-report-content td {
      border:
        1px solid var(--border-color);

      padding: 9px 11px;

      text-align: left;

      min-width: 120px;
    }

    .audit-report-content th {
      background: var(--bg-body);

      color: var(--text-highlight);

      font-weight: 700;
    }

    .audit-report-content td {
      background: var(--bg-input);
    }

    .audit-empty {
      color: var(--text-muted);

      font-style: italic;
    }

    .tags-container {
      display: flex;

      gap: 8px;

      flex-wrap: wrap;

      margin-top: 16px;
    }

    .tag {
      background-color: var(--bg-tag);

      color: var(--text-highlight);

      padding: 4px 10px;

      border-radius: 8px;

      font-size: 0.75rem;

      font-weight: 600;
    }

    .pagination {
      display: flex;

      justify-content: center;

      align-items: center;

      gap: 16px;

      margin-top: 36px;
    }

    .pagination button {
      background-color: var(--bg-card);

      border: 1px solid var(--border-color);

      color: var(--text-main);

      padding: 10px 20px;

      border-radius: 12px;

      cursor: pointer;

      font-weight: 600;

      box-shadow:
        0 4px 12px var(--shadow-color);
    }

    .pagination button:disabled {
      opacity: 0.4;

      cursor: not-allowed;
    }

    .empty-message {
      text-align: center;

      padding: 60px 20px;

      color: var(--text-muted);
    }

    .modal-overlay {
      position: fixed;

      top: 0;
      left: 0;

      width: 100vw;
      height: 100vh;

      background: rgba(0, 0, 0, 0.6);

      backdrop-filter: blur(4px);

      display: none;

      justify-content: center;

      align-items: center;

      z-index: 1000;
    }

    .modal-overlay.active {
      display: flex;
    }

    .modal-content {
      background: var(--bg-card);

      border: 1px solid var(--border-color);

      border-radius: 20px;

      width: 90%;

      max-width: 700px;

      max-height: 90vh;

      overflow-y: auto;

      padding: 24px;

      box-shadow:
        0 10px 30px rgba(0, 0, 0, 0.5);
    }

    .modal-header {
      display: flex;

      justify-content: space-between;

      align-items: center;

      margin-bottom: 20px;
    }

    .form-group {
      margin-bottom: 16px;
    }

    .form-group label {
      display: block;

      font-size: 0.8rem;

      font-weight: 600;

      color: var(--text-muted);

      margin-bottom: 6px;

      text-transform: uppercase;
    }

    .form-control {
      width: 100%;

      padding: 12px;

      background: var(--bg-input);

      border: 1px solid var(--border-color);

      border-radius: 10px;

      color: var(--text-main);

      font-size: 0.9rem;

      outline: none;
    }

    .form-control:focus {
      border-color: var(--text-highlight);
    }

    textarea.form-control {
      min-height: 80px;

      resize: vertical;
    }

    .audit-textarea {
      min-height: 220px !important;

      font-family:
        Consolas,
        Monaco,
        monospace;

      line-height: 1.5;
    }

    .modal-actions {
      display: flex;

      justify-content: flex-end;

      gap: 12px;

      margin-top: 24px;
    }

    .btn-save {
      background-color: var(--bg-tab-active);

      color: white;

      border: none;

      padding: 10px 20px;

      border-radius: 10px;

      cursor: pointer;

      font-weight: 600;
    }

    .btn-cancel {
      background: transparent;

      border: 1px solid var(--border-color);

      color: var(--text-muted);

      padding: 10px 20px;

      border-radius: 10px;

      cursor: pointer;
    }

    @media (max-width: 800px) {

      body {
        padding: 12px;
      }

      .header {
        flex-direction: column;

        align-items: flex-start;

        gap: 16px;
      }

      .header-actions {
        width: 100%;

        flex-wrap: wrap;
      }

      .card-header {
        flex-direction: column;
      }

      .card-header-actions {
        width: 100%;

        flex-wrap: wrap;
      }

      .card-tabs {
        overflow-x: auto;
      }

      .tab-btn {
        white-space: nowrap;
      }

    }

  </style>

</head>

<body>

  <header class="header">

    <div class="title-container">

      <span class="logo-icon"></span>

      <h1>
        SaveInCloud - KB & Quality Audit
      </h1>

    </div>

    <div class="header-actions">

      <div
        id="status-loading"
        class="status-loading"
      >
        Carregando registros...
      </div>

      <button
        class="btn-new"
        onclick="openCreateModal()"
        type="button"
      >
        + Novo Registro
      </button>

      <button
        id="theme-toggle"
        class="theme-toggle-btn"
        type="button"
      >

        <span id="theme-icon">
          🌙
        </span>

        <span id="theme-text">
          Escuro
        </span>

      </button>

    </div>

  </header>

  <main>

    <section class="search-container">

      <input
        type="text"
        id="search-input"
        class="search-input"
        placeholder="Pesquisar por título, problema, solução, atendente, categoria ou tags..."
        autocomplete="off"
      >

    </section>

    <section
      id="cards-container"
      class="cards-grid"
    ></section>

    <nav class="pagination">

      <button
        id="btn-prev"
        disabled
        type="button"
      >
        Anterior
      </button>

      <span
        id="page-info"
        style="
          font-size: 0.9rem;
          color: var(--text-muted);
        "
      >
        Página 1
      </span>

      <button
        id="btn-next"
        disabled
        type="button"
      >
        Próxima
      </button>

    </nav>

  </main>


  <!-- =======================================================
       MODAL
  ======================================================== -->

  <div
    id="modal-form"
    class="modal-overlay"
  >

    <div class="modal-content">

      <div class="modal-header">

        <h3
          id="modal-title"
          style="color: var(--text-highlight);"
        >
          Novo Registro
        </h3>

        <button
          class="btn-action"
          onclick="closeModal()"
          type="button"
        >
          ✕
        </button>

      </div>

      <form
        id="form-registro"
        onsubmit="salvarRegistro(event)"
      >

        <input
          type="hidden"
          id="edit-id"
        >


        <div class="form-group">

          <label>
            Título *
          </label>

          <input
            type="text"
            id="edit-titulo"
            class="form-control"
            required
          >

        </div>


        <div class="form-group">

          <label>
            Categoria
          </label>

          <input
            type="text"
            id="edit-categoria"
            class="form-control"
          >

        </div>


        <div class="form-group">

          <label>
            Tags (separadas por vírgula)
          </label>

          <input
            type="text"
            id="edit-tags"
            class="form-control"
          >

        </div>


        <div class="form-group">

          <label>
            Descrição / Problema
          </label>

          <textarea
            id="edit-descricao"
            class="form-control"
          ></textarea>

        </div>


        <div class="form-group">

          <label>
            Solução *
          </label>

          <textarea
            id="edit-solucao"
            class="form-control"
            required
          ></textarea>

        </div>


        <!-- ===================================================
             AUDITORIA
        ==================================================== -->

        <div class="form-group">

          <label>
            Nota Final
          </label>

          <input
            type="number"
            step="0.1"
            min="0"
            max="5"
            id="edit-nota"
            class="form-control"
          >

        </div>


        <div class="form-group">

          <label>
            Veredito
          </label>

          <input
            type="text"
            id="edit-veredito"
            class="form-control"
          >

        </div>


        <div class="form-group">

          <label>
            Objetivo
          </label>

          <textarea
            id="edit-objetivo"
            class="form-control"
          ></textarea>

        </div>


        <div class="form-group">

          <label>
            Oportunidade PS
          </label>

          <textarea
            id="edit-oportunidade"
            class="form-control"
          ></textarea>

        </div>


        <div class="form-group">

          <label>
            Relatório Completo da Auditoria
          </label>

          <textarea
            id="edit-relatorio"
            class="form-control audit-textarea"
            placeholder="Relatório completo da auditoria em Markdown..."
          ></textarea>

        </div>


        <div class="modal-actions">

          <button
            type="button"
            class="btn-cancel"
            onclick="closeModal()"
          >
            Cancelar
          </button>

          <button
            type="submit"
            class="btn-save"
          >
            Salvar
          </button>

        </div>

      </form>

    </div>

  </div>


  <script>

    let currentPage = 1;

    let currentSearch = '';

    let debounceTimer = null;

    let registrosCache = [];


    const searchInput =
      document.getElementById(
        'search-input'
      );

    const cardsContainer =
      document.getElementById(
        'cards-container'
      );

    const statusLoading =
      document.getElementById(
        'status-loading'
      );

    const btnPrev =
      document.getElementById(
        'btn-prev'
      );

    const btnNext =
      document.getElementById(
        'btn-next'
      );

    const pageInfo =
      document.getElementById(
        'page-info'
      );

    const themeToggleBtn =
      document.getElementById(
        'theme-toggle'
      );

    const themeIcon =
      document.getElementById(
        'theme-icon'
      );

    const themeText =
      document.getElementById(
        'theme-text'
      );


    /* =========================================================
       TEMA
    ========================================================= */

    function initTheme() {

      const savedTheme =
        localStorage.getItem(
          'kb_theme'
        ) || 'dark';

      document.documentElement.setAttribute(
        'data-theme',
        savedTheme
      );

      updateThemeUI(
        savedTheme
      );
    }


    function updateThemeUI(theme) {

      themeIcon.innerText =
        theme === 'light'
          ? '☀️'
          : '🌙';

      themeText.innerText =
        theme === 'light'
          ? 'Claro'
          : 'Escuro';
    }


    themeToggleBtn.addEventListener(
      'click',
      () => {

        const currentTheme =
          document.documentElement
            .getAttribute(
              'data-theme'
            );

        const newTheme =
          currentTheme === 'dark'
            ? 'light'
            : 'dark';

        document.documentElement
          .setAttribute(
            'data-theme',
            newTheme
          );

        localStorage.setItem(
          'kb_theme',
          newTheme
        );

        updateThemeUI(
          newTheme
        );

      }
    );


    /* =========================================================
       CARREGAR REGISTROS
    ========================================================= */

    async function carregarRegistros(
      busca = '',
      pagina = 1
    ) {

      statusLoading.innerText =
        'Carregando registros...';

      try {

        const url =
          `./api.php?action=read` +
          `&search=${encodeURIComponent(busca)}` +
          `&page=${encodeURIComponent(pagina)}` +
          `&limit=10` +
          `&_=${Date.now()}`;


        const response =
          await fetch(
            url,
            {
              method: 'GET',
              cache: 'no-store'
            }
          );


        if (!response.ok) {

          throw new Error(
            `Erro HTTP: ${response.status}`
          );

        }


        const json =
          await response.json();


        if (
          json.success === false &&
          json.error
        ) {

          throw new Error(
            json.error
          );

        }


        registrosCache =
          Array.isArray(json.data)
            ? json.data
            : Array.isArray(json)
              ? json
              : [];


        const totalPaginas =
          Number(
            json.total_pages || 1
          );


        renderizarCards(
          registrosCache
        );


        atualizarPaginacao(
          pagina,
          totalPaginas
        );


        statusLoading.innerText = '';

      }

      catch (error) {

        console.error(
          'Erro ao buscar dados:',
          error
        );

        statusLoading.innerText =
          'Erro ao carregar registros.';

        cardsContainer.innerHTML =
          '<div class="empty-message">' +
          'Erro ao conectar com a API. ' +
          'Verifique o console.' +
          '</div>';

      }

    }

    /* =========================================================

    ========================================================= */

    async function salvarRegistro(
      event
    ) {

      event.preventDefault();


      statusLoading.innerText =
        'Salvando...';


      const id =
        document
          .getElementById(
            'edit-id'
          )
          .value
          .trim();


      const isEdit =
        Boolean(id);


      const payload = {

        titulo:
          document
            .getElementById(
              'edit-titulo'
            )
            .value
            .trim(),


        solucao:
          document
            .getElementById(
              'edit-solucao'
            )
            .value
            .trim(),


        categoria:
          document
            .getElementById(
              'edit-categoria'
            )
            .value
            .trim(),


        tags:
          document
            .getElementById(
              'edit-tags'
            )
            .value
            .trim(),


        descricao:
          document
            .getElementById(
              'edit-descricao'
            )
            .value
            .trim(),


        problema:
          document
            .getElementById(
              'edit-descricao'
            )
            .value
            .trim(),


        nota_final:
          document
            .getElementById(
              'edit-nota'
            )
            .value
            ? parseFloat(
                document
                  .getElementById(
                    'edit-nota'
                  )
                  .value
              )
            : null,


        veredito:
          document
            .getElementById(
              'edit-veredito'
            )
            .value
            .trim(),


        objetivo:
          document
            .getElementById(
              'edit-objetivo'
            )
            .value
            .trim(),


        oportunidade_ps:
          document
            .getElementById(
              'edit-oportunidade'
            )
            .value
            .trim(),


        /* =====================================================
           NOVO:
           SALVA O RELATÓRIO COMPLETO
        ====================================================== */

        relatorio_markdown:
          document
            .getElementById(
              'edit-relatorio'
            )
            .value
            .trim()

      };


      if (isEdit) {

        payload.id =
          parseInt(
            id,
            10
          );

      }


      const action =
        isEdit
          ? 'update'
          : 'create';


      try {

        const response =
          await fetch(
            `./api.php?action=${action}&_=${Date.now()}`,
            {
              method: 'POST',

              cache: 'no-store',

              headers: {

                'Content-Type':
                  'application/json',

                'Cache-Control':
                  'no-cache'

              },

              body:
                JSON.stringify(
                  payload
                )

            }
          );


        const res =
          await response.json();


        console.log(
          'Resposta ao salvar:',
          res
        );


        if (res.success) {

          closeModal();


          await carregarRegistros(
            currentSearch,

            isEdit
              ? currentPage
              : 1
          );

        }

        else {

          alert(
            'Erro ao salvar: ' +
            (
              res.error ||
              res.message ||
              'Erro desconhecido'
            )
          );

        }

      }

      catch (err) {

        console.error(
          'Erro ao gravar:',
          err
        );


        alert(
          'Erro ao se conectar com a API.'
        );

      }

      finally {

        statusLoading.innerText = '';

      }

    }


    /* =========================================================
       EXCLUIR
    ========================================================= */

    async function excluirRegistro(
      id
    ) {

      const registroId =
        parseInt(
          id,
          10
        );


      if (
        !Number.isInteger(
          registroId
        ) ||
        registroId <= 0
      ) {

        alert(
          'ID do registro inválido.'
        );

        return;
      }


      const item =
        registrosCache.find(
          r =>
            Number(r.id) ===
            registroId
        );


      const titulo =
        item?.titulo
          ? `\n\nTítulo: ${item.titulo}`
          : '';


      const confirmou =
        confirm(
          'Tem certeza que deseja excluir este registro permanentemente?' +
          titulo
        );


      if (!confirmou) {
        return;
      }


      statusLoading.innerText =
        'Excluindo...';


      try {

        const url =
          `./api.php?action=delete` +
          `&id=${encodeURIComponent(
            registroId
          )}` +
          `&_=${Date.now()}`;


        console.log(
          'Excluindo registro:',
          {
            id: registroId,
            url: url
          }
        );


        const response =
          await fetch(
            url,
            {
              method: 'POST',

              cache: 'no-store',

              headers: {

                'Content-Type':
                  'application/json',

                'Cache-Control':
                  'no-cache',

                'Pragma':
                  'no-cache'

              },

              body:
                JSON.stringify({
                  id: registroId
                })

            }
          );


        if (!response.ok) {

          throw new Error(
            `Erro HTTP ${response.status}`
          );

        }


        const res =
          await response.json();


        console.log(
          'Resposta da exclusão:',
          res
        );


        if (res.success) {

          alert(
            'Registro excluído com sucesso.'
          );


          if (
            registrosCache.length === 1 &&
            currentPage > 1
          ) {

            await carregarRegistros(
              currentSearch,
              currentPage - 1
            );

          }

          else {

            await carregarRegistros(
              currentSearch,
              currentPage
            );

          }

        }

        else {

          alert(
            'Erro ao excluir: ' +
            (
              res.error ||
              res.message ||
              'Erro desconhecido'
            )
          );

        }

      }

      catch (err) {

        console.error(
          'Erro ao excluir:',
          err
        );


        alert(
          'Erro ao se conectar com a API.\n\n' +
          err.message
        );

      }

      finally {

        statusLoading.innerText = '';

      }

    }

      card

    function atualizarPaginacao(
      paginaAtual,
      totalPaginas
    ) {

      currentPage =
        Number(
          paginaAtual
        ) || 1;


      totalPaginas =

    /* =========================================================
       SEGURANÇA HTML
    ========================================================= */

    function escapeHtml(
      value
    ) {

      return String(
        value ?? ''
      )

        .replace(
          /&/g,
          '&amp;'
        )

        .replace(
          /</g,
          '&lt;'
        )

        .replace(
          />/g,
          '&gt;'
        )

        .replace(
          /"/g,
          '&quot;'
        )

        .replace(
          /'/g,
          '&#039;'
        );

    }


    /* =========================================================
       MARKDOWN → HTML
       =========================================================
       O conteúdo primeiro passa por escapeHtml().
       Isso evita que HTML/JS enviado pela auditoria
       seja executado no navegador.
    ========================================================= */

    function markdownToHtml(
      markdown
    ) {

      if (!markdown) {
        return '';
      }


      let text =
        escapeHtml(
          String(markdown)
        );


      /* -------------------------------------------------------
         CODE BLOCKS
      ------------------------------------------------------- */

      const codeBlocks = [];


      text =
        text.replace(
          /```([\s\S]*?)```/g,
          function (
            match,
            code
          ) {

            const index =
              codeBlocks.length;


            codeBlocks.push(
              `<pre><code>${code.trim()}</code></pre>`
            );


            return `@@CODEBLOCK${index}@@`;

          }
        );


      /* -------------------------------------------------------
         TABELAS
      ------------------------------------------------------- */

      const lines =
        text.split('\n');


      const output = [];

      let i = 0;


      while (
        i <
        lines.length
      ) {

        const current =
          lines[i];


        const next =
          lines[i + 1];


        if (
          current.includes('|') &&
          next &&
          /^\s*\|?\s*:?-+:?\s*(\|\s*:?-+:?\s*)+\|?\s*$/
            .test(next)
        ) {

          const headerCells =
            current
              .trim()
              .replace(
                /^\|/,
                ''
              )
              .replace(
                /\|$/,
                ''
              )
              .split('|')
              .map(
                cell =>
                  cell.trim()
              );


          i += 2;


          const rows = [];


          while (
            i <
              lines.length &&
            lines[i].includes('|') &&
            lines[i].trim() !== ''
          ) {

            rows.push(
              lines[i]
                .trim()
                .replace(
                  /^\|/,
                  ''
                )
                .replace(
                  /\|$/,
                  ''
                )
                .split('|')
                .map(
                  cell =>
                    cell.trim()
                )
            );


            i++;

          }


          let table =
            '<table><thead><tr>';


          headerCells.forEach(
            cell => {

              table +=
                `<th>${inlineMarkdown(
                  cell
                )}</th>`;

            }
          );


          table +=
            '</tr></thead><tbody>';


          rows.forEach(
            row => {

              table +=
                '<tr>';


              headerCells.forEach(
                (
                  _,
                  index
                ) => {

                  table +=
                    `<td>${inlineMarkdown(
                      row[index] || ''
                    )}</td>`;

                }
              );


              table +=
                '</tr>';

            }
          );


          table +=
            '</tbody></table>';


          output.push(
            table
          );


          continue;
        }


        output.push(
          current
        );


        i++;

      }


      text =
        output.join('\n');


      /* -------------------------------------------------------
         INLINE MARKDOWN
      ------------------------------------------------------- */

      text =
        inlineMarkdown(
          text
        );


      /* -------------------------------------------------------
         HEADINGS
      ------------------------------------------------------- */

      text =
        text.replace(
          /^### (.+)$/gm,
          '<h3>$1</h3>'
        );


      text =
        text.replace(
          /^## (.+)$/gm,
          '<h2>$1</h2>'
        );


      text =
        text.replace(
          /^# (.+)$/gm,
          '<h1>$1</h1>'
        );


      /* -------------------------------------------------------
         HORIZONTAL RULE
      ------------------------------------------------------- */

      text =
        text.replace(
          /^---$/gm,
          '<hr>'
        );


      /* -------------------------------------------------------
         BLOCKQUOTE
      ------------------------------------------------------- */

      text =
        text.replace(
          /^&gt; (.+)$/gm,
          '<blockquote>$1</blockquote>'
        );


      /* -------------------------------------------------------
         LISTAS
      ========================================================= */

      text =
        text.replace(
          /(?:^|\n)((?:[-*] .+(?:\n|$))+)/g,
          function (
            match,
            list
          ) {

            const items =
              list
                .trim()
                .split('\n')
                .map(
                  line =>
                    line
                      .replace(
                        /^[-*] /,
                        ''
                      )
                )
                .map(
                  item =>
                    `<li>${item}</li>`
                )
                .join('');


            return `\n<ul>${items}</ul>\n`;

          }
        );


      text =
        text.replace(
          /(?:^|\n)((?:\d+\. .+(?:\n|$))+)/g,
          function (
            match,
            list
          ) {

            const items =
              list
                .trim()
                .split('\n')
                .map(
                  line =>
                    line
                      .replace(
                        /^\d+\. /,
                        ''
                      )
                )
                .map(
                  item =>
                    `<li>${item}</li>`
                )
                .join('');


            return `\n<ol>${items}</ol>\n`;

          }
        );


      /* -------------------------------------------------------
         PARÁGRAFOS
      ------------------------------------------------------- */

      const blocks =
        text
          .split(/\n{2,}/);


      text =
        blocks
          .map(
            block => {

              const trimmed =
                block.trim();


              if (!trimmed) {
                return '';
              }


              if (
                /^<(h1|h2|h3|ul|ol|blockquote|table|pre|hr)/i
                  .test(trimmed)
              ) {

                return trimmed;

              }


              return `
                <p>
                  ${trimmed.replace(
                    /\n/g,
                    '<br>'
                  )}
                </p>
              `;

            }
          )
          .join('');


      /* -------------------------------------------------------
         RESTAURA CODE BLOCKS
      ------------------------------------------------------- */

      text =
        text.replace(
          /@@CODEBLOCK(\d+)@@/g,
          function (
            match,
            index
          ) {

            return (
              codeBlocks[
                Number(index)
              ] || ''
            );

          }
        );


      return text;

    }


    /* =========================================================
       MARKDOWN INLINE
    ========================================================= */

    function inlineMarkdown(
      text
    ) {

      return text

        .replace(
          /`([^`]+)`/g,
          '<code>$1</code>'
        )

        .replace(
          /\*\*([^*]+)\*\*/g,
          '<strong>$1</strong>'
        )

        .replace(
          /__([^_]+)__/g,
          '<strong>$1</strong>'
        )

        .replace(
          /(?<!\*)\*([^*]+)\*(?!\*)/g,
          '<em>$1</em>'
        )

        .replace(
          /(?<!_)_([^_]+)_(?!_)/g,
          '<em>$1</em>'
        );

    }


    /* =========================================================
       PESQUISA
    ========================================================= */

    searchInput.addEventListener(
      'input',
      e => {

        clearTimeout(
          debounceTimer
        );


        currentSearch =
          e.target.value.trim();


        debounceTimer =
          setTimeout(
            () => {

              carregarRegistros(
                currentSearch,
                1
              );

            },
            300
          );

      }
    );


    /* =========================================================
       PAGINAÇÃO
    ========================================================= */

    btnPrev.addEventListener(
      'click',
      () => {

        if (
          currentPage > 1
        ) {

          carregarRegistros(
            currentSearch,
            currentPage - 1
          );

        }

      }
    );


    btnNext.addEventListener(
      'click',
      () => {

        carregarRegistros(
          currentSearch,
          currentPage + 1
        );

      }
    );


    /* =========================================================
       FECHAR MODAL CLICANDO FORA
    ========================================================= */

    document
      .getElementById(
        'modal-form'
      )
      .addEventListener(
        'click',
        event => {

          if (
            event.target.id ===
            'modal-form'
          ) {

            closeModal();

          }

        }
      );


    /* =========================================================
       ESC FECHA MODAL
    ========================================================= */

    document.addEventListener(
      'keydown',
      event => {

        if (
          event.key ===
          'Escape'
        ) {

          closeModal();

        }

      }
    );


    /* =========================================================
       INICIALIZAÇÃO
    ========================================================= */

    document.addEventListener(
      'DOMContentLoaded',
      () => {

        initTheme();

        carregarRegistros(
          '',
          1
        );

      }
    );

  </script>

</body>

</html>
