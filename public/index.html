<!DOCTYPE html>
<html lang="pt-BR">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Base de Conhecimento & Auditoria | Suporte Técnico</title>
  <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet">
  <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.10.5/font/bootstrap-icons.css">
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600;700&display=swap" rel="stylesheet">
  <!-- Marked library para renderizar Markdown do relatório de auditoria -->
  <script src="https://cdn.jsdelivr.net/npm/marked/marked.min.js"></script>
  
  <style>
    :root {
      --bg-dark: #0B0E14;
      --card-bg: #151921;
      --card-border: #232936;
      --accent-cyan: #00F0FF;
      --accent-purple: #7000FF;
      --text-main: #F3F4F6;
      --text-muted: #9CA3AF;
    }

    body {
      background-color: var(--bg-dark);
      color: var(--text-main);
      font-family: 'Inter', sans-serif;
      min-height: 100vh;
    }

    .glass-header {
      background: rgba(21, 25, 33, 0.8);
      backdrop-filter: blur(12px);
      border-bottom: 1px solid var(--card-border);
    }

    .search-box {
      background: #1C222D;
      border: 1px solid var(--card-border);
      color: var(--text-main);
      border-radius: 12px;
      padding: 12px 20px;
      transition: all 0.3s ease;
    }

    .search-box:focus {
      background: #1C222D;
      color: var(--text-main);
      border-color: var(--accent-cyan);
      box-shadow: 0 0 15px rgba(0, 240, 255, 0.2);
    }

    .card-kb {
      background: var(--card-bg);
      border: 1px solid var(--card-border);
      border-radius: 16px;
      transition: transform 0.2s ease, box-shadow 0.2s ease;
      height: 100%;
      display: flex;
      flex-direction: column;
    }

    .card-kb:hover {
      transform: translateY(-4px);
      box-shadow: 0 8px 24px rgba(0, 0, 0, 0.4);
      border-color: rgba(0, 240, 255, 0.3);
    }

    .badge-category {
      background: rgba(112, 0, 255, 0.15);
      color: #A855F7;
      border: 1px solid rgba(112, 0, 255, 0.3);
      font-size: 0.75rem;
      padding: 4px 10px;
      border-radius: 20px;
    }

    .badge-tag {
      background: rgba(0, 240, 255, 0.08);
      color: var(--accent-cyan);
      border: 1px solid rgba(0, 240, 255, 0.2);
      font-size: 0.7rem;
      padding: 2px 8px;
      border-radius: 6px;
      cursor: pointer;
    }

    .badge-tag:hover {
      background: rgba(0, 240, 255, 0.2);
    }

    .badge-score {
      background: rgba(16, 185, 129, 0.15);
      color: #10B981;
      border: 1px solid rgba(16, 185, 129, 0.3);
      font-weight: 700;
      border-radius: 8px;
      padding: 2px 8px;
      font-size: 0.8rem;
    }

    .badge-veredito {
      background: rgba(245, 158, 11, 0.15);
      color: #F59E0B;
      border: 1px solid rgba(245, 158, 11, 0.3);
      border-radius: 8px;
      padding: 2px 8px;
      font-size: 0.75rem;
    }

    .btn-cyber {
      background: linear-gradient(135deg, var(--accent-cyan), var(--accent-purple));
      border: none;
      color: #FFF;
      font-weight: 600;
      border-radius: 10px;
      padding: 10px 20px;
      transition: opacity 0.2s ease;
    }

    .btn-cyber:hover {
      opacity: 0.9;
      color: #FFF;
    }

    /* Estilização de Abas internas nos Cards e no Modal */
    .nav-tabs-cyber {
      border-bottom: 1px solid var(--card-border);
    }

    .nav-tabs-cyber .nav-link {
      color: var(--text-muted);
      border: none;
      border-bottom: 2px solid transparent;
      padding: 8px 12px;
      font-size: 0.85rem;
      font-weight: 500;
      transition: all 0.2s;
    }

    .nav-tabs-cyber .nav-link:hover {
      color: var(--text-main);
      border-color: rgba(0, 240, 255, 0.4);
    }

    .nav-tabs-cyber .nav-link.active {
      color: var(--accent-cyan);
      background: transparent;
      border-bottom: 2px solid var(--accent-cyan);
      font-weight: 600;
    }

    .modal-content {
      background: var(--card-bg);
      border: 1px solid var(--card-border);
      color: var(--text-main);
      border-radius: 16px;
    }

    .form-control {
      background: #1C222D;
      border: 1px solid var(--card-border);
      color: var(--text-main);
      border-radius: 8px;
    }

    .form-control:focus {
      background: #1C222D;
      color: var(--text-main);
      border-color: var(--accent-cyan);
      box-shadow: none;
    }

    .pagination .page-link {
      background: var(--card-bg);
      border-color: var(--card-border);
      color: var(--text-main);
    }

    .pagination .page-item.active .page-link {
      background: var(--accent-cyan);
      border-color: var(--accent-cyan);
      color: #000;
      font-weight: bold;
    }

    /* Container de renderização Markdown */
    .markdown-body {
      font-size: 0.85rem;
      line-height: 1.5;
      color: #D1D5DB;
    }

    .markdown-body h1, .markdown-body h2, .markdown-body h3 {
      color: var(--accent-cyan);
      font-size: 1rem;
      margin-top: 10px;
      margin-bottom: 5px;
    }

    .markdown-body ul, .markdown-body ol {
      padding-left: 20px;
      margin-bottom: 10px;
    }

    .markdown-body code {
      background: #11141A;
      padding: 2px 5px;
      border-radius: 4px;
      color: #F43F5E;
    }
  </style>
</head>
<body>

  <!-- Header -->
  <header class="glass-header sticky-top py-3 mb-4">
    <div class="container d-flex justify-content-between align-items-center">
      <div class="d-flex align-items-center gap-2">
        <i class="bi bi-cpu fs-3 text-info"></i>
        <h4 class="m-0 fw-bold">KB <span style="color: var(--accent-cyan);">Support</span></h4>
      </div>
      <button class="btn btn-cyber d-flex align-items-center gap-2" onclick="openModal()">
        <i class="bi bi-plus-lg"></i> Novo Registro
      </button>
    </div>
  </header>

  <div class="container pb-5">
    <!-- Search Bar -->
    <div class="row mb-4">
      <div class="col-md-8 mx-auto">
        <div class="position-relative">
          <i class="bi bi-search position-absolute top-50 start-0 translate-middle-y ms-3 text-muted"></i>
          <input type="text" id="searchInput" class="form-control search-box ps-5" placeholder="Pesquisar por título, erro, categoria, tag ou veredito..." oninput="onSearchChange()">
        </div>
      </div>
    </div>

    <!-- Cards Container -->
    <div id="cardsContainer" class="row g-4">
      <div class="text-center py-5 text-muted">
        <div class="spinner-border text-info" role="status"></div>
        <p class="mt-2">Carregando registros...</p>
      </div>
    </div>

    <!-- Pagination -->
    <nav class="mt-5">
      <ul id="pagination" class="pagination justify-content-center"></ul>
    </nav>
  </div>

  <!-- Modal Cadastro/Edição -->
  <div class="modal fade" id="kbModal" tabindex="-1" aria-hidden="true">
    <div class="modal-dialog modal-lg modal-dialog-centered">
      <div class="modal-content">
        <div class="modal-header border-secondary">
          <h5 class="modal-title" id="modalTitle">Novo Registro</h5>
          <button type="button" class="btn-close btn-close-white" data-bs-dismiss="modal" aria-label="Close"></button>
        </div>
        <div class="modal-body">
          <form id="kbForm" onsubmit="saveRecord(event)">
            <input type="hidden" id="recordId">

            <!-- Navegação de Abas do Modal -->
            <ul class="nav nav-tabs nav-tabs-cyber mb-3" id="modalTab" role="tablist">
              <li class="nav-item" role="presentation">
                <button class="nav-link active" id="modal-solucao-tab" data-bs-toggle="tab" data-bs-target="#modal-solucao-pane" type="button" role="tab"><i class="bi bi-journal-text me-1"></i> 1. Solução / KB</button>
              </li>
              <li class="nav-item" role="presentation">
                <button class="nav-link" id="modal-auditoria-tab" data-bs-toggle="tab" data-bs-target="#modal-auditoria-pane" type="button" role="tab"><i class="bi bi-shield-check me-1"></i> 2. Auditoria & QA</button>
              </li>
            </ul>

            <div class="tab-content">
              <!-- Conteúdo da Aba 1: Solução -->
              <div class="tab-pane fade show active" id="modal-solucao-pane" role="tabpanel">
                <div class="mb-3">
                  <label class="form-label">Título do Erro / Procedimento *</label>
                  <input type="text" id="inputTitulo" class="form-control" required placeholder="Ex: Erro 502 Bad Gateway no Nginx">
                </div>
                <div class="row">
                  <div class="col-md-6 mb-3">
                    <label class="form-label">Categoria</label>
                    <input type="text" id="inputCategoria" class="form-control" placeholder="Ex: Nginx, SSL, PHP">
                  </div>
                  <div class="col-md-6 mb-3">
                    <label class="form-label">Tags (separadas por vírgula)</label>
                    <input type="text" id="inputTags" class="form-control" placeholder="Ex: erro502, memoria, timeout">
                  </div>
                </div>
                <div class="mb-3">
                  <label class="form-label">Descrição do Problema / Metadados</label>
                  <textarea id="inputDescricao" class="form-control" rows="3" placeholder="Insira detalhes adicionais do atendimento..."></textarea>
                </div>
                <div class="mb-3">
                  <label class="form-label">Solução / Procedimento *</label>
                  <textarea id="inputSolucao" class="form-control" rows="5" required placeholder="Descreva os passos executados para solução..."></textarea>
                </div>
              </div>

              <!-- Conteúdo da Aba 2: Auditoria -->
              <div class="tab-pane fade" id="modal-auditoria-pane" role="tabpanel">
                <div class="row">
                  <div class="col-md-8 mb-3">
                    <label class="form-label">Veredito</label>
                    <input type="text" id="inputVeredito" class="form-control" placeholder="Ex: Resolvido com sucesso, Resolvido Parcialmente">
                  </div>
                  <div class="col-md-4 mb-3">
                    <label class="form-label">Nota Final (0 a 10)</label>
                    <input type="number" step="0.1" min="0" max="10" id="inputNotaFinal" class="form-control" placeholder="10.0">
                  </div>
                </div>
                <div class="mb-3">
                  <label class="form-label">Objetivo do Atendimento</label>
                  <textarea id="inputObjetivo" class="form-control" rows="2" placeholder="Qual era o objetivo principal do suporte?"></textarea>
                </div>
                <div class="mb-3">
                  <label class="form-label">Oportunidade de Prestação de Serviços (PS)</label>
                  <textarea id="inputOportunidadePs" class="form-control" rows="2" placeholder="Oportunidades de upsell ou melhorias identificadas..."></textarea>
                </div>
                <div class="mb-3">
                  <label class="form-label">Relatório Final (Markdown)</label>
                  <textarea id="inputRelatorioMarkdown" class="form-control" rows="5" placeholder="Insira o relatório detalhado em formato Markdown..."></textarea>
                </div>
              </div>
            </div>

            <div class="d-flex justify-content-end gap-2 mt-4 pt-3 border-top border-secondary">
              <button type="button" class="btn btn-outline-secondary" data-bs-dismiss="modal">Cancelar</button>
              <button type="submit" class="btn btn-cyber">Salvar Registro</button>
            </div>
          </form>
        </div>
      </div>
    </div>
  </div>

  <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/js/bootstrap.bundle.min.js"></script>
  <script>
    let currentPage = 1;
    let searchTimeout = null;
    const modal = new bootstrap.Modal(document.getElementById('kbModal'));

    document.addEventListener('DOMContentLoaded', () => {
      fetchData(currentPage);
    });

    function onSearchChange() {
      clearTimeout(searchTimeout);
      searchTimeout = setTimeout(() => {
        currentPage = 1;
        fetchData(currentPage);
      }, 300);
    }

    async function fetchData(page = 1) {
      const search = document.getElementById('searchInput').value.trim();
      const container = document.getElementById('cardsContainer');
      
      try {
        const res = await fetch(`api.php?search=${encodeURIComponent(search)}&page=${page}&limit=9`);
        const result = await res.json();

        if (result.error) {
          container.innerHTML = `<div class="alert alert-danger">${result.error}</div>`;
          return;
        }

        renderCards(result.data);
        renderPagination(result.total_pages, result.page);
      } catch (err) {
        container.innerHTML = `<div class="alert alert-danger">Erro ao carregar dados da API.</div>`;
      }
    }

    function renderCards(data) {
      const container = document.getElementById('cardsContainer');
      if (!data || data.length === 0) {
        container.innerHTML = `
          <div class="text-center py-5 text-muted">
            <i class="bi bi-inbox fs-1"></i>
            <p class="mt-2">Nenhum registro encontrado.</p>
          </div>`;
        return;
      }

      container.innerHTML = data.map((item) => {
        const tagsHtml = item.tags ? item.tags.split(',').map(tag => 
          `<span class="badge-tag" onclick="filterByTag('${tag.trim()}')">#${tag.trim()}</span>`
        ).join(' ') : '';

        const hasAuditoria = item.veredito || item.nota_final || item.relatorio_markdown || item.objetivo;

        // Renderiza Markdown do relatório se existir
        const markdownRendered = item.relatorio_markdown ? marked.parse(item.relatorio_markdown) : '';

        return `
          <div class="col-md-6 col-lg-4">
            <div class="card-kb p-4">
              <!-- Header do Card -->
              <div class="d-flex justify-content-between align-items-start mb-2">
                <div class="d-flex align-items-center gap-2 flex-wrap">
                  <span class="badge-category">${item.categoria || 'Geral'}</span>
                  ${item.nota_final !== null && item.nota_final !== undefined ? `<span class="badge-score"><i class="bi bi-star-fill me-1"></i>${parseFloat(item.nota_final).toFixed(1)}</span>` : ''}
                </div>
                <div class="dropdown">
                  <button class="btn btn-link text-muted p-0" data-bs-toggle="dropdown">
                    <i class="bi bi-three-dots-vertical"></i>
                  </button>
                  <ul class="dropdown-menu dropdown-menu-dark">
                    <li><a class="dropdown-item" href="#" onclick="editRecord(${JSON.stringify(item).replace(/"/g, '&quot;')})"><i class="bi bi-pencil me-2"></i>Editar</a></li>
                    <li><a class="dropdown-item text-danger" href="#" onclick="deleteRecord(${item.id})"><i class="bi bi-trash me-2"></i>Excluir</a></li>
                  </ul>
                </div>
              </div>
              
              <h5 class="fw-bold mb-2">${item.titulo}</h5>

              <!-- Navegação de Abas do Card -->
              <ul class="nav nav-tabs nav-tabs-cyber mb-3" role="tablist">
                <li class="nav-item" role="presentation">
                  <button class="nav-link active" id="card-sol-${item.id}-tab" data-bs-toggle="tab" data-bs-target="#card-sol-${item.id}" type="button" role="tab"><i class="bi bi-check2-circle me-1"></i>Solução</button>
                </li>
                <li class="nav-item" role="presentation">
                  <button class="nav-link ${!hasAuditoria ? 'disabled' : ''}" id="card-aud-${item.id}-tab" data-bs-toggle="tab" data-bs-target="#card-aud-${item.id}" type="button" role="tab"><i class="bi bi-shield-check me-1"></i>Auditoria</button>
                </li>
              </ul>

              <!-- Conteúdo das Abas -->
              <div class="tab-content flex-grow-1 d-flex flex-column mb-3">
                
                <!-- Aba Solução -->
                <div class="tab-pane fade show active flex-grow-1" id="card-sol-${item.id}" role="tabpanel">
                  ${item.descricao ? `<p class="text-muted small mb-2" style="white-space: pre-line;">${item.descricao}</p>` : ''}
                  <div class="bg-dark p-3 rounded-3 border border-secondary border-opacity-25 h-100">
                    <small class="text-info fw-bold d-block mb-1"><i class="bi bi-wrench me-1"></i>Procedimento:</small>
                    <div class="small" style="white-space: pre-line;">${item.solucao}</div>
                  </div>
                </div>

                <!-- Aba Auditoria -->
                <div class="tab-pane fade flex-grow-1" id="card-aud-${item.id}" role="tabpanel">
                  <div class="bg-dark p-3 rounded-3 border border-secondary border-opacity-25 h-100 small">
                    ${item.veredito ? `<div class="mb-2"><span class="badge-veredito"><i class="bi bi-award me-1"></i>${item.veredito}</span></div>` : ''}
                    ${item.objetivo ? `<div class="mb-2"><strong class="text-info">Objetivo:</strong> ${item.objetivo}</div>` : ''}
                    ${item.oportunidade_ps ? `<div class="mb-2"><strong class="text-warning">Oportunidade PS:</strong> ${item.oportunidade_ps}</div>` : ''}
                    ${markdownRendered ? `<div class="markdown-body border-top border-secondary border-opacity-25 pt-2 mt-2">${markdownRendered}</div>` : ''}
                  </div>
                </div>

              </div>

              <!-- Tags -->
              <div class="d-flex flex-wrap gap-1 mt-auto">
                ${tagsHtml}
              </div>
            </div>
          </div>
        `;
      }).join('');
    }

    function filterByTag(tag) {
      document.getElementById('searchInput').value = tag;
      fetchData(1);
    }

    function renderPagination(totalPages, page) {
      const nav = document.getElementById('pagination');
      if (totalPages <= 1) {
        nav.innerHTML = '';
        return;
      }

      let html = '';
      for (let i = 1; i <= totalPages; i++) {
        html += `
          <li class="page-item ${i === page ? 'active' : ''}">
            <button class="page-link" onclick="goToPage(${i})">${i}</button>
          </li>
        `;
      }
      nav.innerHTML = html;
    }

    function goToPage(page) {
      currentPage = page;
      fetchData(currentPage);
    }

    function openModal() {
      document.getElementById('recordId').value = '';
      document.getElementById('kbForm').reset();
      document.getElementById('modalTitle').innerText = 'Novo Registro';
      
      // Reseta para a primeira aba
      const firstTab = new bootstrap.Tab(document.getElementById('modal-solucao-tab'));
      firstTab.show();

      modal.show();
    }

    function editRecord(item) {
      document.getElementById('recordId').value = item.id;
      
      // Aba Solução
      document.getElementById('inputTitulo').value = item.titulo || '';
      document.getElementById('inputCategoria').value = item.categoria || '';
      document.getElementById('inputTags').value = item.tags || '';
      document.getElementById('inputDescricao').value = item.descricao || '';
      document.getElementById('inputSolucao').value = item.solucao || '';

      // Aba Auditoria
      document.getElementById('inputVeredito').value = item.veredito || '';
      document.getElementById('inputNotaFinal').value = item.nota_final !== null ? item.nota_final : '';
      document.getElementById('inputObjetivo').value = item.objetivo || '';
      document.getElementById('inputOportunidadePs').value = item.oportunidade_ps || '';
      document.getElementById('inputRelatorioMarkdown').value = item.relatorio_markdown || '';

      document.getElementById('modalTitle').innerText = 'Editar Registro';

      // Reseta para a primeira aba
      const firstTab = new bootstrap.Tab(document.getElementById('modal-solucao-tab'));
      firstTab.show();

      modal.show();
    }

    async function saveRecord(event) {
      event.preventDefault();
      const id = document.getElementById('recordId').value;
      
      const payload = {
        id: id ? parseInt(id) : undefined,
        titulo: document.getElementById('inputTitulo').value.trim(),
        categoria: document.getElementById('inputCategoria').value.trim(),
        tags: document.getElementById('inputTags').value.trim(),
        descricao: document.getElementById('inputDescricao').value.trim(),
        solucao: document.getElementById('inputSolucao').value.trim(),
        veredito: document.getElementById('inputVeredito').value.trim(),
        nota_final: document.getElementById('inputNotaFinal').value !== '' ? parseFloat(document.getElementById('inputNotaFinal').value) : null,
        objetivo: document.getElementById('inputObjetivo').value.trim(),
        oportunidade_ps: document.getElementById('inputOportunidadePs').value.trim(),
        relatorio_markdown: document.getElementById('inputRelatorioMarkdown').value.trim()
      };

      const method = id ? 'PUT' : 'POST';

      try {
        const res = await fetch('api.php', {
          method: method,
          headers: { 'Content-Type': 'application/json' },
          body: JSON.stringify(payload)
        });

        const result = await res.json();
        if (result.success) {
          modal.hide();
          fetchData(currentPage);
        } else {
          alert('Erro ao salvar: ' + (result.error || 'Erro desconhecido'));
        }
      } catch (err) {
        alert('Erro de comunicação com o servidor.');
      }
    }

    async function deleteRecord(id) {
      if (!confirm('Deseja realmente excluir este registro?')) return;

      try {
        const res = await fetch(`api.php?id=${id}`, { method: 'DELETE' });
        const result = await res.json();
        if (result.success) {
          fetchData(currentPage);
        } else {
          alert('Erro ao excluir registro.');
        }
      } catch (err) {
        alert('Erro na requisição de exclusão.');
      }
    }
  </script>
</body>
</html>
