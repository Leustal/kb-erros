<!DOCTYPE html>
<html lang="pt-BR">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Base de Conhecimento DEVOPS/INFRA</title>
    <!-- Fonts Google & Icons -->
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Fira+Code:wght@400;600;700&family=Inter:wght@300;400;600;800&display=swap" rel="stylesheet">
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet">
    <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.0/font/bootstrap-icons.css">

    <style>
        :root {
            --radius-lg: 16px;
            --radius-md: 12px;
            --radius-sm: 8px;
            --transition-speed: 0.25s;
        }

        body {
            font-family: 'Inter', sans-serif;
            transition: background-color var(--transition-speed), color var(--transition-speed);
        }

        /* === 1. TEMA CLARO TECH === */
        body {
            background: #f0f4f9;
            color: #1e293b !important;
        }

        .title-gradient {
    background: linear-gradient(135deg, #0d6efd 0%, #0dcaf0 100%);
    background-clip: text;
    -webkit-background-clip: text;
    -webkit-text-fill-color: transparent;
    font-weight: 800;
}

        .glass-card {
            background: rgba(255, 255, 255, 0.85) !important;
            backdrop-filter: blur(12px);
            -webkit-backdrop-filter: blur(12px);
            border: 1px solid rgba(13, 110, 253, 0.15) !important;
            border-radius: var(--radius-lg) !important;
            box-shadow: 0 8px 32px 0 rgba(31, 38, 135, 0.05);
            transition: all var(--transition-speed) ease-in-out;
        }

        .glass-card:hover {
            transform: translateY(-4px);
            box-shadow: 0 12px 24px -6px rgba(13, 110, 253, 0.2);
            border-color: rgba(13, 110, 253, 0.4) !important;
        }

        .form-control, .form-select, .input-group-text {
            border-radius: var(--radius-md) !important;
            border: 1px solid #cbd5e1;
            background-color: #ffffff;
            transition: all 0.2s ease;
        }

        .input-group .form-control {
            border-top-right-radius: 0 !important;
            border-bottom-right-radius: 0 !important;
        }

        .input-group .input-group-text:first-child {
            border-top-left-radius: var(--radius-md) !important;
            border-bottom-left-radius: var(--radius-md) !important;
        }

        .form-control:focus, .form-select:focus {
            box-shadow: 0 0 0 3px rgba(13, 110, 253, 0.25);
            border-color: #0d6efd;
        }

        .code-box-wrapper {
            position: relative;
            background-color: #1e293b !important;
            border: 1px solid rgba(13, 110, 253, 0.2) !important;
            border-radius: var(--radius-md);
            padding: 1.2rem;
            overflow: hidden;
        }

        pre { 
            font-family: 'Fira Code', monospace; 
            font-size: 0.9rem; 
            font-weight: 500;
            line-height: 1.6;
            white-space: pre-wrap; 
            word-break: break-all;
            color: #38bdf8 !important;
            margin: 0;
        }

        .btn-copy {
            position: absolute;
            top: 10px;
            right: 10px;
            background: rgba(255, 255, 255, 0.1);
            color: #94a3b8;
            border: 1px solid rgba(255, 255, 255, 0.15);
            font-size: 0.75rem;
            padding: 4px 10px;
            border-radius: var(--radius-sm);
            backdrop-filter: blur(4px);
            transition: all 0.2s;
        }

        .btn-copy:hover {
            background: #0d6efd;
            color: #fff;
            box-shadow: 0 0 10px rgba(13, 110, 253, 0.5);
        }

        .badge-neon {
            border-radius: var(--radius-sm);
            font-weight: 600;
            padding: 0.35em 0.65em;
            letter-spacing: 0.3px;
        }

        .tag-badge { 
            cursor: pointer; 
            transition: all 0.2s ease; 
            background: rgba(13, 110, 253, 0.1) !important;
            color: #0d6efd !important;
            border: 1px solid rgba(13, 110, 253, 0.2);
        }

        .tag-badge:hover { 
            transform: scale(1.05); 
            background: #0d6efd !important;
            color: #fff !important;
            box-shadow: 0 0 10px rgba(13, 110, 253, 0.4);
        }

        .btn-action {
            border-radius: var(--radius-md) !important;
            font-weight: 600;
            transition: all 0.2s ease;
        }


        /* === 2. TEMA ESCURO FUTURÍSTICO / NEON === */
        body.dark-mode {
            background-color: #080b11 !important;
            color: #f1f5f9 !important;
        }

        body.dark-mode .title-gradient {
    background: linear-gradient(135deg, #00f2fe 0%, #4facfe 100%);
    background-clip: text;
    -webkit-background-clip: text;
    -webkit-text-fill-color: transparent;
    text-shadow: 0 0 20px rgba(0, 242, 254, 0.3);
}

        body.dark-mode .glass-card {
            background: rgba(15, 23, 42, 0.65) !important;
            backdrop-filter: blur(16px);
            -webkit-backdrop-filter: blur(16px);
            border: 1px solid rgba(56, 189, 248, 0.15) !important;
            box-shadow: 0 8px 32px 0 rgba(0, 0, 0, 0.37);
        }

        body.dark-mode .glass-card:hover {
            border-color: rgba(56, 189, 248, 0.5) !important;
            box-shadow: 0 0 20px rgba(56, 189, 248, 0.2), 0 10px 20px -5px rgba(0, 0, 0, 0.5);
        }

        body.dark-mode .modal-content {
            background-color: #0f172a !important;
            border: 1px solid rgba(56, 189, 248, 0.3) !important;
            border-radius: var(--radius-lg);
            box-shadow: 0 0 30px rgba(0, 242, 254, 0.15);
            color: #f1f5f9 !important;
        }

        body.dark-mode .form-control, 
        body.dark-mode .form-select,
        body.dark-mode .input-group-text {
            background-color: rgba(30, 41, 59, 0.7) !important;
            color: #f8fafc !important;
            border-color: rgba(255, 255, 255, 0.1) !important;
        }

        body.dark-mode .form-control:focus, 
        body.dark-mode .form-select:focus {
            border-color: #38bdf8 !important;
            box-shadow: 0 0 12px rgba(56, 189, 248, 0.4) !important;
        }

        body.dark-mode .form-control::placeholder { 
            color: #64748b !important; 
        }

        body.dark-mode .code-box-wrapper {
            background-color: #030712 !important;
            border: 1px solid rgba(56, 189, 248, 0.25) !important;
            box-shadow: inset 0 0 15px rgba(0, 0, 0, 0.8);
        }

        body.dark-mode pre {
            color: #38bdf8 !important;
            text-shadow: 0 0 8px rgba(56, 189, 248, 0.3);
        }

        body.dark-mode .btn-copy {
            background: rgba(56, 189, 248, 0.1);
            color: #38bdf8;
            border-color: rgba(56, 189, 248, 0.3);
        }

        body.dark-mode .btn-copy:hover {
            background: #38bdf8;
            color: #030712;
            box-shadow: 0 0 12px rgba(56, 189, 248, 0.8);
        }

        body.dark-mode .tag-badge { 
            background: rgba(56, 189, 248, 0.1) !important;
            color: #38bdf8 !important;
            border: 1px solid rgba(56, 189, 248, 0.25);
        }

        body.dark-mode .tag-badge:hover { 
            background: #38bdf8 !important;
            color: #030712 !important;
            box-shadow: 0 0 12px rgba(56, 189, 248, 0.6);
        }

        body.dark-mode .shortcut-hint kbd {
            background-color: #1e293b;
            color: #38bdf8;
            border: 1px solid rgba(56, 189, 248, 0.3);
        }

        /* Botão Principal Neon Cyber */
        .btn-neon-primary {
            background: linear-gradient(135deg, #00f2fe 0%, #4facfe 100%);
            border: none;
            color: #030712;
            font-weight: 700;
            border-radius: var(--radius-md);
            transition: all 0.25s ease;
        }

        .btn-neon-primary:hover {
            transform: translateY(-2px);
            box-shadow: 0 0 20px rgba(0, 242, 254, 0.6);
            color: #000;
        }

        kbd { 
            font-size: 0.75rem; 
            padding: 3px 6px; 
            border-radius: 4px;
        }
    </style>
</head>
<body>

<div class="container py-4">
    <!-- Header -->
    <div class="d-flex justify-content-between align-items-center mb-4 pb-2 border-bottom border-secondary border-opacity-10">
        <div>
            <h2 class="title-gradient m-0"><i class="bi bi-cpu-fill me-2"></i>DEVOPS // KB</h2>
            <small class="text-secondary fw-semibold">Base de Conhecimento e Resolução de Erros</small>
        </div>
        <div class="d-flex gap-2">
            <button id="btnExport" class="btn btn-outline-secondary btn-action btn-sm" onclick="exportToCSV()">
                <i class="bi bi-file-earmark-spreadsheet"></i> Exportar
            </button>
            <button id="btnDarkMode" class="btn btn-outline-info btn-action btn-sm" onclick="toggleDarkMode()">
                <i class="bi bi-moon-stars"></i> Modo Escuro
            </button>
            <button class="btn btn-neon-primary btn-sm px-3" onclick="openModal()">
                <i class="bi bi-plus-lg me-1"></i> Cadastrar Erro
            </button>
        </div>
    </div>

    <!-- Filtros de Busca -->
    <div class="row g-2 mb-4">
        <div class="col-md-10">
            <div class="input-group">
                <span class="input-group-text bg-transparent border-end-0"><i class="bi bi-search text-info"></i></span>
                <input type="text" id="searchInput" class="form-control border-start-0" placeholder="Pesquisar por erro, comando, banco de dados ou solução..." oninput="handleSearch()">
                <span class="input-group-text shortcut-hint bg-transparent d-none d-md-flex align-items-center">
                    <kbd>/</kbd> <span class="mx-1 text-muted">ou</span> <kbd>ctrl+k</kbd>
                </span>
                <button class="btn btn-outline-secondary" type="button" onclick="clearSearch()" id="btnClearSearch" style="display:none;">
                    <i class="bi bi-x-lg"></i>
                </button>
            </div>
        </div>
        <div class="col-md-2">
            <select id="limitSelect" class="form-select" onchange="loadData(1)">
                <option value="10">10/pág</option>
                <option value="25">25/pág</option>
                <option value="50">50/pág</option>
            </select>
        </div>
    </div>

    <!-- Lista de Cards -->
    <div id="cardsContainer"></div>

    <!-- Paginação e Footer -->
    <div class="d-flex justify-content-between align-items-center mt-4">
        <span id="totalInfo" class="text-secondary small fw-semibold">Mostrando 0 registros</span>
        <nav><ul class="pagination pagination-sm m-0" id="pagination"></ul></nav>
    </div>
</div>

<!-- Modal Form Manual -->
<div class="modal fade" id="crudModal" tabindex="-1">
    <div class="modal-dialog modal-lg modal-dialog-centered">
        <div class="modal-content">
            <div class="modal-header border-bottom border-secondary border-opacity-20">
                <h5 class="modal-title fw-bold" id="modalTitle">Cadastrar Novo Registro</h5>
                <button type="button" class="btn-close" data-bs-dismiss="modal"></button>
            </div>
            <div class="modal-body">
                <form id="crudForm">
                    <input type="hidden" id="itemId">
                    <div class="mb-3">
                        <label class="form-label fw-bold">Título do Erro / Procedimento *</label>
                        <input type="text" id="titulo" class="form-control" required placeholder="Ex: Erro de conexão com Postgres">
                    </div>
                    <div class="row mb-3">
                        <div class="col-md-6">
                            <label class="form-label fw-bold">Categoria</label>
                            <input type="text" id="categoria" class="form-control" placeholder="Ex: Procedimentos, Banco de Dados, Docker">
                        </div>
                        <div class="col-md-6">
                            <label class="form-label fw-bold">Tags (separadas por vírgula)</label>
                            <input type="text" id="tags" class="form-control" placeholder="Ex: postgres, snapshot, porta">
                        </div>
                    </div>
                    <div class="mb-3">
                        <label class="form-label fw-bold">Descrição do Problema</label>
                        <textarea id="descricao" class="form-control" rows="2" placeholder="Detalhes técnicos ou mensagem de erro original..."></textarea>
                    </div>
                    <div class="mb-3">
                        <label class="form-label fw-bold">Solução / Procedimento *</label>
                        <textarea id="solucao" class="form-control font-monospace" rows="6" required placeholder="Passos executados para resolver o problema..."></textarea>
                    </div>
                </form>
            </div>
            <div class="modal-footer border-top border-secondary border-opacity-20">
                <button type="button" class="btn btn-outline-secondary btn-action btn-sm" data-bs-dismiss="modal">Cancelar</button>
                <button type="button" class="btn btn-neon-primary btn-sm px-4" onclick="saveRecord()">Salvar Registro</button>
            </div>
        </div>
    </div>
</div>

<script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/js/bootstrap.bundle.min.js"></script>
<script>
    let currentPage = 1;
    let searchTimeout = null;
    let currentData = [];
    let modalInstance = null;

    document.addEventListener('DOMContentLoaded', () => {
        modalInstance = new bootstrap.Modal(document.getElementById('crudModal'));
        
        const savedTheme = localStorage.getItem('kb_theme');
        if (savedTheme === 'dark' || !savedTheme) {
            document.body.classList.add('dark-mode');
            document.getElementById('btnDarkMode').innerHTML = '<i class="bi bi-sun"></i> Modo Claro';
        } else {
            document.body.classList.remove('dark-mode');
            document.getElementById('btnDarkMode').innerHTML = '<i class="bi bi-moon-stars"></i> Modo Escuro';
        }

        loadData();

        document.addEventListener('keydown', (e) => {
            const searchInput = document.getElementById('searchInput');
            if ((e.key === '/' || (e.ctrlKey && e.key.toLowerCase() === 'k')) && document.activeElement !== searchInput) {
                e.preventDefault();
                searchInput.focus();
                searchInput.select();
            } else if (e.key === 'Escape' && document.activeElement === searchInput) {
                clearSearch();
            }
        });
    });

    async function loadData(page = 1) {
        currentPage = page;
        const search = document.getElementById('searchInput').value.trim();
        const limit = document.getElementById('limitSelect').value;

        document.getElementById('btnClearSearch').style.display = search ? 'block' : 'none';

        try {
            const res = await fetch(`api.php?search=${encodeURIComponent(search)}&page=${page}&limit=${limit}`);
            const result = await res.json();

            if (result.error) throw new Error(result.error);

            currentData = result.data || [];
            renderCards(currentData);
            renderPagination(result.total_pages, result.page);
            document.getElementById('totalInfo').innerText = `Mostrando ${currentData.length} de ${result.total} registros`;
        } catch (err) {
            console.error(err);
            document.getElementById('cardsContainer').innerHTML = `<div class="alert alert-danger glass-card">Erro ao carregar dados: ${err.message}</div>`;
        }
    }

    function renderCards(data) {
        const container = document.getElementById('cardsContainer');
        if (!data || data.length === 0) {
            container.innerHTML = '<div class="alert alert-warning text-center glass-card my-4">Nenhum registro encontrado.</div>';
            return;
        }

        container.innerHTML = data.map(item => {
            const tagsHtml = item.tags ? item.tags.split(',').map(tag => {
                const cleanTag = tag.trim();
                return cleanTag ? `<span class="badge tag-badge badge-neon me-1" onclick="filterByTag('${cleanTag}')">#${cleanTag}</span>` : '';
            }).join('') : '';

            return `
                <div class="card glass-card mb-3">
                    <div class="card-body">
                        <div class="d-flex justify-content-between align-items-start mb-2">
                            <h5 class="fw-bold mb-0 text-info">${escapeHtml(item.titulo)}</h5>
                            <div>
                                <span class="badge bg-secondary bg-opacity-20 text-secondary border border-secondary border-opacity-20 badge-neon me-2">${escapeHtml(item.categoria || 'Geral')}</span>
                                <button class="btn btn-outline-warning btn-action btn-sm py-0 px-2 me-1" onclick="editRecord(${item.id})"><i class="bi bi-pencil"></i></button>
                                <button class="btn btn-outline-danger btn-action btn-sm py-0 px-2" onclick="deleteRecord(${item.id})"><i class="bi bi-trash"></i></button>
                            </div>
                        </div>

                        ${item.descricao ? `<p class="card-text text-muted small mb-3">${escapeHtml(item.descricao)}</p>` : ''}

                        <div class="code-box-wrapper mb-3">
                            <button class="btn btn-sm btn-copy" onclick="copyToClipboard(this)">
                                <i class="bi bi-clipboard me-1"></i> Copiar
                            </button>
                            <pre>${escapeHtml(item.solucao)}</pre>
                        </div>

                        <div class="d-flex justify-content-between align-items-center">
                            <div>${tagsHtml}</div>
                            <small class="text-muted opacity-75 font-monospace" style="font-size: 0.75rem;">${item.criado_em ? item.criado_em.split(' ')[0] : ''}</small>
                        </div>
                    </div>
                </div>
            `;
        }).join('');
    }

    function renderPagination(totalPages, activePage) {
        const pagination = document.getElementById('pagination');
        if (totalPages <= 1) { pagination.innerHTML = ''; return; }

        let html = `<li class="page-item ${activePage === 1 ? 'disabled' : ''}">
            <a class="page-link glass-card" href="#" onclick="loadData(${activePage - 1}); return false;">Anterior</a>
        </li>`;

        for (let i = 1; i <= totalPages; i++) {
            if (i === 1 || i === totalPages || (i >= activePage - 2 && i <= activePage + 2)) {
                html += `<li class="page-item ${i === activePage ? 'active' : ''}">
                    <a class="page-link glass-card" href="#" onclick="loadData(${i}); return false;">${i}</a>
                </li>`;
            }
        }

        html += `<li class="page-item ${activePage === totalPages ? 'disabled' : ''}">
            <a class="page-link glass-card" href="#" onclick="loadData(${activePage + 1}); return false;">Próxima</a>
        </li>`;

        pagination.innerHTML = html;
    }

    function handleSearch() {
        clearTimeout(searchTimeout);
        searchTimeout = setTimeout(() => loadData(1), 300);
    }

    function filterByTag(tagName) {
        document.getElementById('searchInput').value = tagName;
        loadData(1);
    }

    function clearSearch() {
        document.getElementById('searchInput').value = '';
        loadData(1);
    }

    function openModal(item = null) {
        document.getElementById('crudForm').reset();
        document.getElementById('itemId').value = item ? item.id : '';
        document.getElementById('modalTitle').innerText = item ? 'Editar Registro' : 'Cadastrar Novo Registro';

        if (item) {
            document.getElementById('titulo').value = item.titulo || '';
            document.getElementById('categoria').value = item.categoria || '';
            document.getElementById('tags').value = item.tags || '';
            document.getElementById('descricao').value = item.descricao || '';
            document.getElementById('solucao').value = item.solucao || '';
        }
        modalInstance.show();
    }

    async function saveRecord() {
        const id = document.getElementById('itemId').value;
        const payload = {
            id: id ? parseInt(id) : undefined,
            titulo: document.getElementById('titulo').value.trim(),
            categoria: document.getElementById('categoria').value.trim(),
            tags: document.getElementById('tags').value.trim(),
            descricao: document.getElementById('descricao').value.trim(),
            solucao: document.getElementById('solucao').value.trim()
        };

        if (!payload.titulo || !payload.solucao) {
            alert('Título e Solução são obrigatórios.');
            return;
        }

        const method = id ? 'PUT' : 'POST';
        try {
            const res = await fetch('api.php', {
                method: method,
                headers: { 'Content-Type': 'application/json' },
                body: JSON.stringify(payload)
            });
            
            const result = await res.json();
            if (result.error) throw new Error(result.error);

            modalInstance.hide();
            loadData(currentPage);
        } catch (err) {
            alert('Erro ao salvar: ' + err.message);
        }
    }

    function editRecord(id) {
        const item = currentData.find(x => x.id === id);
        if (item) openModal(item);
    }

    async function deleteRecord(id) {
        if (!confirm('Deseja realmente excluir este registro?')) return;
        try {
            const res = await fetch(`api.php?id=${id}`, { method: 'DELETE' });
            const result = await res.json();
            if (result.error) throw new Error(result.error);
            loadData(currentPage);
        } catch (err) {
            alert('Erro ao excluir: ' + err.message);
        }
    }

    function copyToClipboard(btn) {
        const pre = btn.nextElementSibling;
        navigator.clipboard.writeText(pre.innerText).then(() => {
            const originalHtml = btn.innerHTML;
            btn.innerHTML = '<i class="bi bi-check2"></i> Copiado!';
            btn.classList.replace('btn-copy', 'btn-success');
            setTimeout(() => {
                btn.innerHTML = originalHtml;
                btn.classList.replace('btn-success', 'btn-copy');
            }, 2000);
        });
    }

    function toggleDarkMode() {
        document.body.classList.toggle('dark-mode');
        const isDark = document.body.classList.contains('dark-mode');
        
        localStorage.setItem('kb_theme', isDark ? 'dark' : 'light');

        document.getElementById('btnDarkMode').innerHTML = isDark ? 
            '<i class="bi bi-sun"></i> Modo Claro' : '<i class="bi bi-moon-stars"></i> Modo Escuro';
    }

    function exportToCSV() {
        if (!currentData || currentData.length === 0) {
            alert('Nenhum dado disponível para exportar.');
            return;
        }

        const headers = ['ID', 'Título', 'Categoria', 'Tags', 'Descrição', 'Solução', 'Criado Em'];
        const rows = currentData.map(item => [
            item.id,
            `"${(item.titulo || '').replace(/"/g, '""')}"`,
            `"${(item.categoria || '').replace(/"/g, '""')}"`,
            `"${(item.tags || '').replace(/"/g, '""')}"`,
            `"${(item.descricao || '').replace(/"/g, '""')}"`,
            `"${(item.solucao || '').replace(/"/g, '""')}"`,
            item.criado_em || ''
        ]);

        const csvContent = 'data:text/csv;charset=utf-8,\uFEFF' + [headers.join(','), ...rows.map(e => e.join(','))].join('\n');
        const encodedUri = encodeURI(csvContent);
        const link = document.createElement('a');
        link.setAttribute('href', encodedUri);
        link.setAttribute('download', `base_conhecimento_export_${new Date().toISOString().split('T')[0]}.csv`);
        document.body.appendChild(link);
        link.click();
        document.body.removeChild(link);
    }

    function escapeHtml(text) {
        if (!text) return '';
        return text.replace(/&/g, "&amp;").replace(/</g, "&lt;").replace(/>/g, "&gt;").replace(/"/g, "&quot;").replace(/'/g, "&#039;");
    }
</script>
</body>
</html>
