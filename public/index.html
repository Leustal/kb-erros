<!DOCTYPE html>
<html lang="pt-BR">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>SaveInCloud - KB & Quality Audit</title>
  <link rel="icon" href="data:image/svg+xml,<svg xmlns=%22http://www.w3.org/2000/svg%22 viewBox=%220 0 100 100%22><text y=%22.9em%22 font-size=%2290%22>🧠</text></svg>">
  <style>
    * {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Helvetica, Arial, sans-serif;
    }

    body {
      background-color: #0f172a;
      color: #f8fafc;
      padding: 20px;
    }

    .header {
      display: flex;
      justify-content: space-between;
      align-items: center;
      margin-bottom: 20px;
      padding-bottom: 15px;
      border-bottom: 1px solid #1e293b;
    }

    .title-container {
      display: flex;
      align-items: center;
      gap: 12px;
    }

    .title-container h1 {
      font-size: 1.5rem;
      font-weight: 700;
      color: #f8fafc;
    }

    .logo-icon {
      width: 28px;
      height: 28px;
      background-color: #06b6d4;
      border-radius: 50%;
      display: inline-block;
    }

    .status-loading {
      font-size: 0.9rem;
      color: #94a3b8;
    }

    .search-container {
      margin-bottom: 25px;
    }

    .search-input {
      width: 100%;
      padding: 14px 18px;
      background-color: #1e293b;
      border: 1px solid #334155;
      border-radius: 8px;
      color: #f8fafc;
      font-size: 0.95rem;
      outline: none;
      transition: border-color 0.2s;
    }

    .search-input:focus {
      border-color: #06b6d4;
    }

    .search-input::placeholder {
      color: #64748b;
    }

    .cards-grid {
      display: flex;
      flex-direction: column;
      gap: 16px;
    }

    .card {
      background-color: #1e293b;
      border: 1px solid #334155;
      border-radius: 8px;
      padding: 20px;
    }

    .card-header {
      display: flex;
      justify-content: space-between;
      align-items: flex-start;
      margin-bottom: 12px;
    }

    .card-title {
      font-size: 1.1rem;
      font-weight: 600;
      color: #38bdf8;
    }

    .badge {
      background-color: #0f172a;
      color: #94a3b8;
      padding: 4px 10px;
      border-radius: 4px;
      font-size: 0.8rem;
      border: 1px solid #334155;
    }

    .card-section {
      margin-bottom: 12px;
    }

    .card-section-title {
      font-size: 0.85rem;
      font-weight: 600;
      color: #94a3b8;
      text-transform: uppercase;
      letter-spacing: 0.05em;
      margin-bottom: 4px;
    }

    .card-text {
      font-size: 0.95rem;
      line-height: 1.5;
      color: #cbd5e1;
      white-space: pre-wrap;
    }

    .tags-container {
      display: flex;
      gap: 6px;
      flex-wrap: wrap;
      margin-top: 10px;
    }

    .tag {
      background-color: #0284c720;
      color: #38bdf8;
      padding: 2px 8px;
      border-radius: 4px;
      font-size: 0.75rem;
    }

    .pagination {
      display: flex;
      justify-content: center;
      align-items: center;
      gap: 15px;
      margin-top: 30px;
    }

    .pagination button {
      background-color: #1e293b;
      border: 1px solid #334155;
      color: #f8fafc;
      padding: 8px 16px;
      border-radius: 6px;
      cursor: pointer;
    }

    .pagination button:disabled {
      opacity: 0.5;
      cursor: not-allowed;
    }

    .empty-message {
      text-align: center;
      padding: 40px;
      color: #64748b;
    }
  </style>
</head>
<body>

  <header class="header">
    <div class="title-container">
      <span class="logo-icon"></span>
      <h1>SaveInCloud - KB & Quality Audit</h1>
    </div>
    <div id="status-loading" class="status-loading">Carregando registros...</div>
  </header>

  <main>
    <section class="search-container">
      <input 
        type="text" 
        id="search-input" 
        class="search-input" 
        placeholder="Pesquisar por título, problema, solução, atendente, categoria ou tags..."
        autocomplete="off"
      >
    </section>

    <section id="cards-container" class="cards-grid">
      <!-- Os registros serão renderizados via JavaScript -->
    </section>

    <nav class="pagination">
      <button id="btn-prev" disabled>Anterior</button>
      <span id="page-info" style="font-size: 0.9rem; color: #94a3b8;">Página 1</span>
      <button id="btn-next" disabled>Próxima</button>
    </nav>
  </main>

  <script>
    let currentPage = 1;
    let currentSearch = '';
    let debounceTimer = null;

    const searchInput = document.getElementById('search-input');
    const cardsContainer = document.getElementById('cards-container');
    const statusLoading = document.getElementById('status-loading');
    const btnPrev = document.getElementById('btn-prev');
    const btnNext = document.getElementById('btn-next');
    const pageInfo = document.getElementById('page-info');

    async function carregarRegistros(busca = '', pagina = 1) {
      statusLoading.innerText = 'Carregando registros...';
      
      try {
        const response = await fetch(`./api.php?search=${encodeURIComponent(busca)}&page=${pagina}&limit=10`);
        
        if (!response.ok) {
          throw new Error(`Erro na requisição: ${response.status}`);
        }

        const json = await response.json();
        
        // Tratamento flexível: funciona tanto se retornar { data: [...] } quanto [...]
        const registros = Array.isArray(json) ? json : (json.data || []);
        const totalPaginas = json.total_pages || 1;

        renderizarCards(registros);
        atualizarPaginacao(pagina, totalPaginas);

        statusLoading.innerText = '';
      } catch (error) {
        console.error('Erro ao buscar dados:', error);
        statusLoading.innerText = 'Erro ao carregar registros.';
        cardsContainer.innerHTML = '<div class="empty-message">Erro ao conectar com a API. Verifique o console.</div>';
      }
    }

    function renderizarCards(registros) {
      if (!registros || registros.length === 0) {
        cardsContainer.innerHTML = '<div class="empty-message">Nenhum registro encontrado.</div>';
        return;
      }

      cardsContainer.innerHTML = registros.map(item => {
        const categoria = item.categoria || 'Geral';
        const tagsArray = item.tags ? item.tags.split(',').filter(t => t.trim() !== '') : [];

        return `
          <article class="card">
            <header class="card-header">
              <h2 class="card-title">${escapeHtml(item.titulo || 'Sem Título')}</h2>
              <span class="badge">${escapeHtml(categoria)}</span>
            </header>

            ${item.descricao ? `
              <div class="card-section">
                <div class="card-section-title">Descrição / Problema</div>
                <div class="card-text">${escapeHtml(item.descricao)}</div>
              </div>
            ` : ''}

            ${item.solucao ? `
              <div class="card-section">
                <div class="card-section-title">Solução</div>
                <div class="card-text">${escapeHtml(item.solucao)}</div>
              </div>
            ` : ''}

            ${tagsArray.length > 0 ? `
              <footer class="tags-container">
                ${tagsArray.map(tag => `<span class="tag">${escapeHtml(tag.trim())}</span>`).join('')}
              </footer>
            ` : ''}
          </article>
        `;
      }).join('');
    }

    function atualizarPaginacao(paginaAtual, totalPaginas) {
      currentPage = paginaAtual;
      pageInfo.innerText = `Página ${paginaAtual} de ${totalPaginas || 1}`;
      
      btnPrev.disabled = paginaAtual <= 1;
      btnNext.disabled = paginaAtual >= totalPaginas;
    }

    function escapeHtml(str) {
      return String(str)
        .replace(/&/g, '&amp;')
        .replace(/</g, '&lt;')
        .replace(/>/g, '&gt;')
        .replace(/"/g, '&quot;')
        .replace(/'/g, '&#039;');
    }

    // Eventos de Busca e Paginação
    searchInput.addEventListener('input', (e) => {
      clearTimeout(debounceTimer);
      currentSearch = e.target.value.trim();
      debounceTimer = setTimeout(() => {
        carregarRegistros(currentSearch, 1);
      }, 300);
    });

    btnPrev.addEventListener('click', () => {
      if (currentPage > 1) {
        carregarRegistros(currentSearch, currentPage - 1);
      }
    });

    btnNext.addEventListener('click', () => {
      carregarRegistros(currentSearch, currentPage + 1);
    });

    // Carga inicial ao abrir a página
    document.addEventListener('DOMContentLoaded', () => {
      carregarRegistros();
    });
  </script>
</body>
</html>
