<!DOCTYPE html>
<html lang="pt-BR">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Base de Conhecimento & Auditoria - SaveinCloud</title>
    <!-- Font Awesome para Ícones -->
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    <!-- Marked.js para renderizar Markdown da auditoria -->
    <script src="https://cdn.jsdelivr.net/npm/marked/marked.min.js"></script>
    <style>
        :root {
            --bg-body: #13151b;
            --bg-card: #1e222d;
            --border-card: #2d3342;
            --text-primary: #f0f4f8;
            --text-secondary: #a0aec0;
            --accent-cyan: #00d2ff;
            --accent-blue: #3182ce;
            --accent-green: #38a169;
            --accent-red: #e53e3e;
            --tag-bg: rgba(0, 210, 255, 0.12);
            --tag-text: #00d2ff;
            --shadow: 0 4px 15px rgba(0, 0, 0, 0.3);
        }

        * {
            box-sizing: border-box;
            margin: 0;
            padding: 0;
            font-family: 'Segoe UI', system-ui, -apple-system, sans-serif;
        }

        body {
            background-color: var(--bg-body);
            color: var(--text-primary);
            padding: 24px;
            min-height: 100vh;
        }

        header {
            max-width: 1400px;
            margin: 0 auto 24px auto;
            display: flex;
            justify-content: space-between;
            align-items: center;
            border-bottom: 1px solid var(--border-card);
            padding-bottom: 16px;
        }

        header h1 {
            font-size: 22px;
            color: var(--text-primary);
            display: flex;
            align-items: center;
            gap: 10px;
        }

        header h1 i {
            color: var(--accent-cyan);
        }

        .search-bar {
            max-width: 1400px;
            margin: 0 auto 24px auto;
            display: flex;
            gap: 12px;
        }

        .search-bar input {
            flex: 1;
            background: var(--bg-card);
            border: 1px solid var(--border-card);
            border-radius: 8px;
            padding: 12px 16px;
            color: var(--text-primary);
            font-size: 14px;
            outline: none;
            transition: border-color 0.2s;
        }

        .search-bar input:focus {
            border-color: var(--accent-cyan);
        }

        /* GRID RESPONSIVO: ALINHAMENTO AO TOPO PERMITE ALTURA DINÂMICA POR CARD */
        .cards-grid {
            max-width: 1400px;
            margin: 0 auto;
            display: grid;
            grid-template-columns: repeat(auto-fill, minmax(360px, 1fr));
            gap: 24px;
            align-items: start;
        }

        .card-kb {
            background-color: var(--bg-card);
            border: 1px solid var(--border-card);
            border-radius: 12px;
            display: flex;
            flex-direction: column;
            padding: 18px;
            box-shadow: var(--shadow);
            position: relative;
            transition: transform 0.2s, border-color 0.2s;
            height: auto;
        }

        .card-kb:hover {
            border-color: rgba(0, 210, 255, 0.4);
        }

        /* TOPO DO CARD: ABAS + AÇÕES */
        .card-header {
            display: flex;
            justify-content: space-between;
            align-items: center;
            border-bottom: 1px solid var(--border-card);
            padding-bottom: 10px;
            margin-bottom: 14px;
        }

        .card-tabs {
            display: flex;
            gap: 8px;
        }

        .tab-btn {
            background: none;
            border: none;
            color: var(--text-secondary);
            font-size: 13px;
            font-weight: 600;
            cursor: pointer;
            display: flex;
            align-items: center;
            gap: 6px;
            padding: 6px 10px;
            border-radius: 6px;
            transition: all 0.2s;
        }

        .tab-btn:hover {
            color: var(--text-primary);
            background: rgba(255, 255, 255, 0.05);
        }

        .tab-btn.active {
            color: var(--accent-cyan);
            background: rgba(0, 210, 255, 0.1);
            border-bottom: 2px solid var(--accent-cyan);
        }

        .card-actions {
            display: flex;
            gap: 6px;
        }

        .action-btn {
            background: rgba(255, 255, 255, 0.05);
            border: 1px solid var(--border-card);
            color: var(--text-secondary);
            width: 32px;
            height: 32px;
            border-radius: 6px;
            display: flex;
            align-items: center;
            justify-content: center;
            cursor: pointer;
            transition: all 0.2s;
            font-size: 13px;
        }

        .action-btn:hover {
            color: var(--text-primary);
            background: rgba(255, 255, 255, 0.12);
        }

        .action-btn.copy-btn:hover { color: var(--accent-cyan); border-color: var(--accent-cyan); }
        .action-btn.edit-btn:hover { color: #4299e1; border-color: #4299e1; }
        .action-btn.delete-btn:hover { color: var(--accent-red); border-color: var(--accent-red); }

        /* CONTEÚDO DAS ABAS */
        .tab-content {
            display: none;
            font-size: 13px;
            line-height: 1.6;
            color: var(--text-primary);
            word-break: break-word;
        }

        .tab-content.active {
            display: block;
        }

        .card-title {
            font-size: 16px;
            font-weight: 700;
            color: var(--text-primary);
            margin-bottom: 12px;
            line-height: 1.3;
        }

        .meta-info {
            background: rgba(0, 0, 0, 0.2);
            border-radius: 8px;
            padding: 10px 12px;
            margin-bottom: 12px;
            border: 1px solid rgba(255, 255, 255, 0.03);
        }

        .meta-info p {
            margin: 4px 0;
            font-size: 12px;
            color: var(--text-secondary);
        }

        .meta-info strong {
            color: var(--text-primary);
        }

        .content-block {
            margin-bottom: 12px;
        }

        .content-block h4 {
            font-size: 13px;
            color: var(--accent-cyan);
            margin-bottom: 6px;
            display: flex;
            align-items: center;
            gap: 6px;
        }

        .procedure-box {
            background-color: rgba(0, 0, 0, 0.3);
            border-left: 3px solid var(--accent-cyan);
            border-radius: 4px;
            padding: 12px;
            white-space: pre-wrap;
            font-family: inherit;
        }

        .badge {
            display: inline-block;
            padding: 3px 8px;
            border-radius: 4px;
            font-size: 11px;
            font-weight: 700;
            text-transform: uppercase;
        }

        .badge-exito { background: rgba(56, 161, 105, 0.2); color: #48bb78; border: 1px solid #48bb78; }
        .badge-parcial { background: rgba(221, 107, 32, 0.2); color: #ed8936; border: 1px solid #ed8936; }
        .badge-falha { background: rgba(229, 62, 62, 0.2); color: #f56565; border: 1px solid #f56565; }

        .markdown-render {
            background: rgba(0, 0, 0, 0.25);
            border-radius: 6px;
            padding: 12px;
            margin-top: 10px;
            border: 1px solid var(--border-card);
            max-height: 400px;
            overflow-y: auto;
        }

        .markdown-render table {
            width: 100%;
            border-collapse: collapse;
            margin: 10px 0;
            font-size: 11px;
        }

        .markdown-render th, .markdown-render td {
            border: 1px solid var(--border-card);
            padding: 6px 8px;
            text-align: left;
        }

        .card-footer {
            margin-top: 14px;
            padding-top: 10px;
            border-top: 1px solid rgba(255, 255, 255, 0.05);
            display: flex;
            flex-wrap: wrap;
            gap: 6px;
            align-items: center;
        }

        .category-badge {
            background: rgba(49, 130, 206, 0.2);
            color: #63b3ed;
            border: 1px solid #3182ce;
            border-radius: 4px;
            font-size: 11px;
            padding: 2px 8px;
            font-weight: 600;
        }

        .tag {
            background-color: var(--tag-bg);
            color: var(--tag-text);
            border: 1px solid rgba(0, 210, 255, 0.3);
            border-radius: 4px;
            font-size: 11px;
            padding: 2px 8px;
        }

        /* MODAL DE EDIÇÃO */
        .modal-overlay {
            position: fixed;
            top: 0; left: 0; right: 0; bottom: 0;
            background: rgba(0, 0, 0, 0.75);
            display: none;
            justify-content: center;
            align-items: center;
            z-index: 1000;
            padding: 20px;
        }

        .modal-overlay.active { display: flex; }

        .modal-container {
            background: var(--bg-card);
            border: 1px solid var(--border-card);
            border-radius: 12px;
            width: 100%;
            max-width: 650px;
            max-height: 90vh;
            overflow-y: auto;
            padding: 24px;
            box-shadow: var(--shadow);
        }

        .modal-header {
            display: flex;
            justify-content: space-between;
            align-items: center;
            margin-bottom: 18px;
            border-bottom: 1px solid var(--border-card);
            padding-bottom: 12px;
        }

        .modal-header h3 { color: var(--accent-cyan); font-size: 18px; }
        .close-modal { background: none; border: none; color: var(--text-secondary); font-size: 20px; cursor: pointer; }

        .form-group { margin-bottom: 14px; }
        .form-group label { display: block; font-size: 12px; color: var(--text-secondary); margin-bottom: 6px; font-weight: 600; }
        .form-group input, .form-group textarea {
            width: 100%;
            background: rgba(0, 0, 0, 0.25);
            border: 1px solid var(--border-card);
            border-radius: 6px;
            padding: 10px;
            color: var(--text-primary);
            font-size: 13px;
            outline: none;
        }

        .modal-footer {
            display: flex;
            justify-content: flex-end;
            gap: 10px;
            margin-top: 20px;
            border-top: 1px solid var(--border-card);
            padding-top: 14px;
        }

        .btn-save { background: var(--accent-cyan); color: #000; font-weight: 700; border: none; padding: 10px 18px; border-radius: 6px; cursor: pointer; }
        .btn-cancel { background: rgba(255, 255, 255, 0.1); color: var(--text-primary); border: none; padding: 10px 18px; border-radius: 6px; cursor: pointer; }

        .toast {
            position: fixed;
            bottom: 24px;
            right: 24px;
            background: var(--accent-cyan);
            color: #000;
            padding: 12px 20px;
            border-radius: 8px;
            font-weight: 700;
            box-shadow: var(--shadow);
            display: none;
            z-index: 2000;
        }
    </style>
</head>
<body>

    <header>
        <h1><i class="fa-solid fa-brain"></i> SaveinCloud - KB & Quality Audit</h1>
        <div id="total-count" style="color: var(--text-secondary); font-size: 13px;">Carregando registros...</div>
    </header>

    <div class="search-bar">
        <input type="text" id="searchInput" placeholder="Pesquisar por título, problema, solução, atendente, categoria ou tags..." onkeyup="filterCards()">
    </div>

    <main class="cards-grid" id="cardsGrid"></main>

    <!-- MODAL DE EDIÇÃO -->
    <div class="modal-overlay" id="editModal">
        <div class="modal-container">
            <div class="modal-header">
                <h3><i class="fa-solid fa-pen-to-square"></i> Editar Registro</h3>
                <button class="close-modal" onclick="closeEditModal()">&times;</button>
            </div>
            <form id="editForm" onsubmit="saveCardEdit(event)">
                <input type="hidden" id="edit_id">
                <div class="form-group"><label>Título</label><input type="text" id="edit_titulo" required></div>
                <div class="form-group"><label>Categoria</label><input type="text" id="edit_categoria" required></div>
                <div class="form-group"><label>Problema Relatado</label><textarea id="edit_problema" required></textarea></div>
                <div class="form-group"><label>Solução / Procedimento</label><textarea id="edit_solucao" rows="6" required></textarea></div>
                <div class="form-group"><label>Tags (separadas por vírgula)</label><input type="text" id="edit_tags"></div>
                <div class="modal-footer">
                    <button type="button" class="btn-cancel" onclick="closeEditModal()">Cancelar</button>
                    <button type="submit" class="btn-save">Salvar Alterações</button>
                </div>
            </form>
        </div>
    </div>

    <div class="toast" id="toast">Ação realizada com sucesso!</div>

    <script>
        let allRecords = [];

        document.addEventListener('DOMContentLoaded', fetchRecords);

        async function fetchRecords() {
            try {
                const response = await fetch('api.php?action=list');
                const data = await response.json();
                if (data.status === 'success') {
                    allRecords = data.data;
                    renderCards(allRecords);
                }
            } catch (err) {
                console.error(err);
            }
        }

        function renderCards(records) {
            const grid = document.getElementById('cardsGrid');
            document.getElementById('total-count').innerText = `${records.length} registro(s) encontrado(s)`;
            
            if (records.length === 0) {
                grid.innerHTML = '<p style="color: var(--text-secondary); grid-column: 1/-1; text-align: center; padding: 40px;">Nenhum atendimento registrado.</p>';
                return;
            }

            grid.innerHTML = records.map(item => {
                const sol = item.aba_solucao || {};
                const aud = item.aba_auditoria || item.aba_auditoria_qualidade || {};
                
                const tagsList = Array.isArray(sol.tags) ? sol.tags : (sol.tags ? sol.tags.split(',') : []);
                const tagsHtml = tagsList.map(t => `<span class="tag">#${t.trim().replace(/^#/, '')}</span>`).join('');
                
                const veredito = aud.veredito_exito || aud.veredito || 'Não informado';
                let badgeClass = 'badge-exito';
                if (veredito.toLowerCase().includes('parcial')) badgeClass = 'badge-parcial';
                if (veredito.toLowerCase().includes('não') || veredito.toLowerCase().includes('falha')) badgeClass = 'badge-falha';

                const fullTextToCopy = `TITULO: ${sol.titulo || ''}\n\nPROBLEMA:\n${sol.problema || ''}\n\nSOLUÇÃO:\n${sol.solucao || ''}`;

                return `
                <div class="card-kb" id="card-${item.id}">
                    <div class="card-header">
                        <div class="card-tabs">
                            <button class="tab-btn active" onclick="switchTab(this, 'solucao')"><i class="fa-solid fa-circle-check"></i> Solução</button>
                            <button class="tab-btn" onclick="switchTab(this, 'auditoria')"><i class="fa-solid fa-shield-halved"></i> Auditoria</button>
                        </div>
                        <div class="card-actions">
                            <button class="action-btn copy-btn" title="Copiar Solução" onclick="copyCardContent(\`${escapeText(fullTextToCopy)}\`)"><i class="fa-regular fa-copy"></i></button>
                            <button class="action-btn edit-btn" title="Editar Registro" onclick="openEditModal(${item.id})"><i class="fa-solid fa-pen-to-square"></i></button>
                            <button class="action-btn delete-btn" title="Excluir Registro" onclick="deleteCard(${item.id})"><i class="fa-solid fa-trash-can"></i></button>
                        </div>
                    </div>

                    <div class="tab-content solucao active">
                        <div class="card-title">${sol.titulo || 'Atendimento sem título'}</div>
                        <div class="meta-info">
                            <p><strong><i class="fa-solid fa-user-gear"></i> Atendente:</strong> ${item.atendente_nome || 'N/I'}</p>
                            <p><strong><i class="fa-solid fa-envelope"></i> Email:</strong> ${item.cliente_email || 'N/I'}</p>
                            <p><strong><i class="fa-regular fa-clock"></i> Início:</strong> ${item.hora_inicio || 'N/I'} | <strong>Fim:</strong> ${item.hora_finalizacao || 'N/I'}</p>
                        </div>
                        ${sol.problema ? `<div class="content-block"><h4><i class="fa-solid fa-triangle-exclamation"></i> Problema Relatado:</h4><p style="color: var(--text-secondary);">${sol.problema}</p></div>` : ''}
                        <div class="content-block">
                            <h4><i class="fa-solid fa-wrench"></i> Procedimento / Solução:</h4>
                            <div class="procedure-box">${sol.solucao || 'Sem descrição da solução.'}</div>
                        </div>
                    </div>

                    <div class="tab-content auditoria">
                        <div class="meta-info">
                            <p><strong><i class="fa-solid fa-bullseye"></i> Objetivo:</strong> ${aud.objetivo_atendimento || aud.objetivo || 'N/I'}</p>
                            <p><strong><i class="fa-solid fa-chart-line"></i> Veredito:</strong> <span class="badge ${badgeClass}">${veredito}</span></p>
                            <p><strong><i class="fa-solid fa-star" style="color: #ecc94b;"></i> Nota Final:</strong> ${aud.nota_final || 'N/A'}</p>
                            ${aud.oportunidade_comercial || aud.oportunidade_ps ? `<p><strong><i class="fa-solid fa-hand-holding-dollar"></i> Oportunidade PS:</strong> ${aud.oportunidade_comercial || aud.oportunidade_ps}</p>` : ''}
                        </div>
                        ${aud.relatorio_markdown ? `<div class="content-block"><h4><i class="fa-solid fa-file-contract"></i> Relatório de Auditoria:</h4><div class="markdown-render">${marked.parse(aud.relatorio_markdown)}</div></div>` : ''}
                    </div>

                    <div class="card-footer">
                        ${sol.categoria ? `<span class="category-badge"><i class="fa-solid fa-folder"></i> ${sol.categoria}</span>` : ''}
                        ${tagsHtml}
                    </div>
                </div>`;
            }).join('');
        }

        function switchTab(btnElement, tabName) {
            const card = btnElement.closest('.card-kb');
            card.querySelectorAll('.tab-btn').forEach(b => b.classList.remove('active'));
            card.querySelectorAll('.tab-content').forEach(c => c.classList.remove('active'));
            btnElement.classList.add('active');
            const target = card.querySelector(`.tab-content.${tabName}`);
            if (target) target.classList.add('active');
        }

        function copyCardContent(text) {
            navigator.clipboard.writeText(text).then(() => showToast("Conteúdo copiado com sucesso!"));
        }

        async function deleteCard(id) {
            if (!confirm('Deseja excluir este registro permanentemente?')) return;
            const res = await (await fetch(`api.php?action=delete&id=${id}`, { method: 'DELETE' })).json();
            if (res.status === 'success') {
                showToast('Registro excluído!');
                allRecords = allRecords.filter(r => r.id != id);
                renderCards(allRecords);
            }
        }

        function openEditModal(id) {
            const record = allRecords.find(r => r.id == id);
            if (!record) return;
            const sol = record.aba_solucao || {};
            document.getElementById('edit_id').value = record.id;
            document.getElementById('edit_titulo').value = sol.titulo || '';
            document.getElementById('edit_categoria').value = sol.categoria || '';
            document.getElementById('edit_problema').value = sol.problema || '';
            document.getElementById('edit_solucao').value = sol.solucao || '';
            document.getElementById('edit_tags').value = Array.isArray(sol.tags) ? sol.tags.join(', ') : (sol.tags || '');
            document.getElementById('editModal').classList.add('active');
        }

        function closeEditModal() { document.getElementById('editModal').classList.remove('active'); }

        async function saveCardEdit(e) {
            e.preventDefault();
            const id = document.getElementById('edit_id').value;
            const payload = {
                id: id,
                aba_solucao: {
                    titulo: document.getElementById('edit_titulo').value,
                    categoria: document.getElementById('edit_categoria').value,
                    problema: document.getElementById('edit_problema').value,
                    solucao: document.getElementById('edit_solucao').value,
                    tags: document.getElementById('edit_tags').value.split(',').map(t => t.trim()).filter(t => t)
                }
            };
            const res = await (await fetch('api.php?action=update', {
                method: 'PUT',
                headers: { 'Content-Type': 'application/json' },
                body: JSON.stringify(payload)
            })).json();

            if (res.status === 'success') {
                showToast('Atualizado com sucesso!');
                closeEditModal();
                fetchRecords();
            }
        }

        function filterCards() {
            const term = document.getElementById('searchInput').value.toLowerCase();
            const filtered = allRecords.filter(item => {
                const sol = item.aba_solucao || {};
                const searchStr = [sol.titulo, sol.problema, sol.solucao, sol.categoria, item.atendente_nome, item.cliente_email].join(' ').toLowerCase();
                return searchStr.includes(term);
            });
            renderCards(filtered);
        }

        function showToast(msg) {
            const toast = document.getElementById('toast');
            toast.innerText = msg;
            toast.style.display = 'block';
            setTimeout(() => { toast.style.display = 'none'; }, 3000);
        }

        function escapeText(str) {
            return str.replace(/`/g, '\\`').replace(/\$/g, '\\$');
        }
    </script>
</body>
</html>
