<!DOCTYPE html>
<html lang="pt-BR">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Base de Conhecimento DEVOPS/INFRA</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet">
    <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.0/font/bootstrap-icons.css">

    <style>
        /* === 1. TEMA CLARO (PADRÃO) === */
        body {
            background-color: #f8f9fa !important;
            color: #212529 !important;
            transition: background-color 0.2s, color 0.2s;
        }

        .card, .modal-content {
            background-color: #ffffff !important;
            color: #212529 !important;
            border-color: #dee2e6 !important;
        }

        .code-box-wrapper {
            position: relative;
            background-color: #f1f3f5 !important;
            border: 1px solid #ced4da !important;
            border-radius: 6px;
            padding: 1rem;
        }

        pre { 
            font-family: 'Consolas', 'Courier New', monospace; 
            font-size: 0.95rem; 
            font-weight: 600;
            line-height: 1.5;
            white-space: pre-wrap; 
            word-break: break-all;
            color: #0d6efd !important;
            padding-top: 4px;
            margin: 0;
        }

        .btn-copy {
            position: absolute;
            top: 8px;
            right: 8px;
            background-color: #e9ecef;
            color: #495057;
            border: 1px solid #ced4da;
            font-size: 0.75rem;
            padding: 2px 8px;
            border-radius: 4px;
            z-index: 10;
        }

        .btn-copy:hover {
            background-color: #dee2e6;
            color: #212529;
        }

        .shortcut-hint kbd {
            background-color: #e9ecef;
            color: #495057;
            border: 1px solid #ced4da;
        }


        /* === 2. TEMA ESCURO (DARK MODE) === */
        body.dark-mode {
            background-color: #121212 !important;
            color: #f1f1f1 !important;
        }

        body.dark-mode .card, 
        body.dark-mode .modal-content {
            background-color: #1e1e1e !important;
            color: #f1f1f1 !important;
            border-color: #333 !important;
        }

        body.dark-mode .form-control, 
        body.dark-mode .form-select,
        body.dark-mode .input-group-text {
            background-color: #252525 !important;
            color: #ffffff !important;
            border-color: #444 !important;
        }

        body.dark-mode .form-control::placeholder { 
            color: #aaaaaa !important; 
            opacity: 1; 
        }

        body.dark-mode .input-group-text { 
            color: #cccccc !important; 
        }

        body.dark-mode .shortcut-hint kbd {
            background-color: #333333;
            color: #ffffff;
            border-color: #555555;
        }

        body.dark-mode .btn-outline-secondary,
        body.dark-mode .btn-outline-dark {
            color: #e0e0e0 !important;
            border-color: #555 !important;
            background-color: #2a2a2a !important;
        }

        body.dark-mode .btn-outline-secondary:hover,
        body.dark-mode .btn-outline-dark:hover {
            background-color: #3d3d3d !important;
            color: #fff !important;
        }

        body.dark-mode .code-box-wrapper {
            background-color: #0d1117 !important;
            border: 1px solid #30363d !important;
        }

        body.dark-mode pre {
            color: #79c0ff !important;
        }

        body.dark-mode .btn-copy {
            background-color: #21262d;
            color: #c9d1d9;
            border: 1px solid #363b42;
        }

        body.dark-mode .btn-copy:hover {
            background-color: #30363d;
            color: #ffffff;
        }


        /* === 3. UTILITÁRIOS === */
        .tag-badge { 
            cursor: pointer; 
            transition: transform 0.1s; 
        }

        .tag-badge:hover { 
            transform: scale(1.08); 
            opacity: 0.9; 
        }

        kbd { 
            font-size: 0.75rem; 
            padding: 2px 5px; 
        }
    </style>
</head>
<body>

<div class="container py-4">
    <!-- Header -->
    <div class="d-flex justify-content-between align-items-center mb-3">
        <div>
            <h2 class="fw-bold m-0">Base de Conhecimento DEVOPS/INFRA</h2>
            <small class="text-secondary">Registro de erros, diagnósticos e soluções</small>
        </div>
        <div class="d-flex gap-2">
            <button id="btnExport" class="btn btn-outline-secondary btn-sm" onclick="exportToCSV()">
                <i class="bi bi-file-earmark-spreadsheet"></i> Exportar CSV
            </button>
            <button id="btnDarkMode" class="btn btn-outline-dark btn-sm" onclick="toggleDarkMode()">
                <i class="bi bi-moon-stars"></i> Modo Escuro
            </button>
            <button class="btn btn-primary btn-sm fw-bold" onclick="openModal()">
                <i class="bi bi-plus-lg"></i> Cadastrar Erro
            </button>
        </div>
    </div>

    <!-- Filtros de Busca -->
    <div class="row g-2 mb-4">
        <div class="col-md-10">
            <div class="input-group">
                <span class="input-group-text"><i class="bi bi-search"></i></span>
                <input type="text" id="searchInput" class="form-control" placeholder="Pesquisar por erro, comando, banco de dados ou solução..." oninput="handleSearch()">
                <span class="input-group-text shortcut-hint bg-transparent border-start-0 d-none d-md-flex align-items-center">
                    <kbd>/</kbd> <span class="mx-1">ou</span> <kbd>ctrl+k</kbd>
                </span>
                <button class="btn btn-outline-secondary" type="button" onclick="clearSearch()" id="btnClearSearch" style="display:none;">
                    <i class="bi bi-x-lg"></i>
                </button>
            </div>
        </div>
        <div class="col-md-2">
            <select id="limitSelect" class="form-select" onchange="loadData(1)">
                <option value="10">10/pág</option>
                <option value="25">25/pág</option>
                <option value="50">50/pág</option>
            </select>
        </div>
    </div>

    <!-- Lista de Cards -->
    <div id="cardsContainer"></div>

    <!-- Paginação e Footer -->
    <div class="d-flex justify-content-between align-items-center mt-4">
        <span id="totalInfo" class="text-secondary small">Mostrando 0 registros</span>
        <nav><ul class="pagination pagination-sm m-0" id="pagination"></ul></nav>
    </div>
</div>

<!-- Modal Form Manual -->
<div class="modal fade" id="crudModal" tabindex="-1">
    <div class="modal-dialog modal-lg">
        <div class="modal-content">
            <div class="modal-header">
                <h5 class="modal-title" id="modalTitle">Cadastrar Novo Registro</h5>
                <button type="button" class="btn-close" data-bs-dismiss="modal"></button>
            </div>
            <div class="modal-body">
                <form id="crudForm">
                    <input type="hidden" id="itemId">
                    <div class="mb-3">
                        <label class="form-label fw-bold">Título do Erro / Procedimento *</label>
                        <input type="text" id="titulo" class="form-control" required placeholder="Ex: Erro de conexão com Postgres">
                    </div>
                    <div class="row mb-3">
                        <div class="col-md-6">
                            <label class="form-label fw-bold">Categoria</label>
                            <input type="text" id="categoria" class="form-control" placeholder="Ex: Procedimentos, Banco de Dados, Docker">
                        </div>
                        <div class="col-md-6">
                            <label class="form-label fw-bold">Tags (separadas por vírgula)</label>
                            <input type="text" id="tags" class="form-control" placeholder="Ex: postgres, snapshot, porta">
                        </div>
                    </div>
                    <div class="mb-3">
                        <label class="form-label fw-bold">Descrição do Problema</label>
                        <textarea id="descricao" class="form-control" rows="2" placeholder="Detalhes técnicos ou mensagem de erro original..."></textarea>
                    </div>
                    <div class="mb-3">
                        <label class="form-label fw-bold">Solução / Procedimento *</label>
                        <textarea id="solucao" class="form-control" rows="6" required placeholder="Passos executados para resolver o problema..."></textarea>
                    </div>
                </form>
            </div>
            <div class="modal-footer">
                <button type="button" class="btn btn-secondary btn-sm" data-bs-dismiss="modal">Cancelar</button>
                <button type="button" class="btn btn-primary btn-sm fw-bold" onclick="saveRecord()">Salvar Registro</button>
            </div>
        </div>
    </div>
</div>

<script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/js/bootstrap.bundle.min.js"></script>
<script>
    let currentPage = 1;
    let searchTimeout = null;
    let currentData = [];
    let modalInstance = null;

    document.addEventListener('DOMContentLoaded', () => {
        modalInstance = new bootstrap.Modal(document.getElementById('crudModal'));
        
        // Verifica tema salvo ou ativa escuro por padrão se não houver preferência
        const savedTheme = localStorage.getItem('kb_theme');
        if (savedTheme === 'dark' || !savedTheme) {
            document.body.classList.add('dark-mode');
            document.getElementById('btnDarkMode').innerHTML = '<i class="bi bi-sun"></i> Modo Claro';
        } else {
            document.body.classList.remove('dark-mode');
            document.getElementById('btnDarkMode').innerHTML = '<i class="bi bi-moon-stars"></i> Modo Escuro';
        }

        loadData();

        document.addEventListener('keydown', (e) => {
            const searchInput = document.getElementById('searchInput');
            if ((e.key === '/' || (e.ctrlKey && e.key.toLowerCase() === 'k')) && document.activeElement !== searchInput) {
                e.preventDefault();
                searchInput.focus();
                searchInput.select();
            } else if (e.key === 'Escape' && document.activeElement === searchInput) {
                clearSearch();
            }
        });
    });

    async function loadData(page = 1) {
        currentPage = page;
        const search = document.getElementById('searchInput').value.trim();
        const limit = document.getElementById('limitSelect').value;

        document.getElementById('btnClearSearch').style.display = search ? 'block' : 'none';

        try {
            const res = await fetch(`api.php?search=${encodeURIComponent(search)}&page=${page}&limit=${limit}`);
            const result = await res.json();

            if (result.error) throw new Error(result.error);

            currentData = result.data || [];
            renderCards(currentData);
            renderPagination(result.total_pages, result.page);
            document.getElementById('totalInfo').innerText = `Mostrando ${currentData.length} de ${result.total} registros`;
        } catch (err) {
            console.error(err);
            document.getElementById('cardsContainer').innerHTML = `<div class="alert alert-danger">Erro ao carregar dados: ${err.message}</div>`;
        }
    }

    function renderCards(data) {
        const container = document.getElementById('cardsContainer');
        if (!data || data.length === 0) {
            container.innerHTML = '<div class="alert alert-warning text-center my-4">Nenhum registro encontrado.</div>';
            return;
        }

        container.innerHTML = data.map(item => {
            const tagsHtml = item.tags ? item.tags.split(',').map(tag => {
                const cleanTag = tag.trim();
                return cleanTag ? `<span class="badge bg-secondary tag-badge me-1" onclick="filterByTag('${cleanTag}')">${cleanTag}</span>` : '';
            }).join('') : '';

            return `
                <div class="card mb-3 shadow-sm">
                    <div class="card-body">
                        <div class="d-flex justify-content-between align-items-start mb-2">
                            <h5 class="card-title text-primary fw-bold mb-0">${escapeHtml(item.titulo)}</h5>
                            <div>
                                <span class="badge bg-light text-dark border me-2">${escapeHtml(item.categoria || 'Geral')}</span>
                                <button class="btn btn-outline-warning btn-sm py-0 px-2" onclick="editRecord(${item.id})">Editar</button>
                                <button class="btn btn-outline-danger btn-sm py-0 px-2" onclick="deleteRecord(${item.id})">Excluir</button>
                            </div>
                        </div>

                        ${item.descricao ? `<p class="card-text text-muted small mb-2">${escapeHtml(item.descricao)}</p>` : ''}

                        <div class="code-box-wrapper mb-2">
                            <button class="btn btn-sm btn-copy" onclick="copyToClipboard(this)">
                                <i class="bi bi-clipboard"></i> Copiar
                            </button>
                            <pre>${escapeHtml(item.solucao)}</pre>
                        </div>

                        <div class="d-flex justify-content-between align-items-center">
                            <div>${tagsHtml}</div>
                            <small class="text-muted opacity-75">${item.criado_em ? item.criado_em.split(' ')[0] : ''}</small>
                        </div>
                    </div>
                </div>
            `;
        }).join('');
    }

    function renderPagination(totalPages, activePage) {
        const pagination = document.getElementById('pagination');
        if (totalPages <= 1) { pagination.innerHTML = ''; return; }

        let html = `<li class="page-item ${activePage === 1 ? 'disabled' : ''}">
            <a class="page-link" href="#" onclick="loadData(${activePage - 1}); return false;">Anterior</a>
        </li>`;

        for (let i = 1; i <= totalPages; i++) {
            if (i === 1 || i === totalPages || (i >= activePage - 2 && i <= activePage + 2)) {
                html += `<li class="page-item ${i === activePage ? 'active' : ''}">
                    <a class="page-link" href="#" onclick="loadData(${i}); return false;">${i}</a>
                </li>`;
            }
        }

        html += `<li class="page-item ${activePage === totalPages ? 'disabled' : ''}">
            <a class="page-link" href="#" onclick="loadData(${activePage + 1}); return false;">Próxima</a>
        </li>`;

        pagination.innerHTML = html;
    }

    function handleSearch() {
        clearTimeout(searchTimeout);
        searchTimeout = setTimeout(() => loadData(1), 300);
    }

    function filterByTag(tagName) {
        document.getElementById('searchInput').value = tagName;
        loadData(1);
    }

    function clearSearch() {
        document.getElementById('searchInput').value = '';
        loadData(1);
    }

    function openModal(item = null) {
        document.getElementById('crudForm').reset();
        document.getElementById('itemId').value = item ? item.id : '';
        document.getElementById('modalTitle').innerText = item ? 'Editar Registro' : 'Cadastrar Novo Registro';

        if (item) {
            document.getElementById('titulo').value = item.titulo || '';
            document.getElementById('categoria').value = item.categoria || '';
            document.getElementById('tags').value = item.tags || '';
            document.getElementById('descricao').value = item.descricao || '';
            document.getElementById('solucao').value = item.solucao || '';
        }
        modalInstance.show();
    }

    async function saveRecord() {
        const id = document.getElementById('itemId').value;
        const payload = {
            id: id ? parseInt(id) : undefined,
            titulo: document.getElementById('titulo').value.trim(),
            categoria: document.getElementById('categoria').value.trim(),
            tags: document.getElementById('tags').value.trim(),
            descricao: document.getElementById('descricao').value.trim(),
            solucao: document.getElementById('solucao').value.trim()
        };

        if (!payload.titulo || !payload.solucao) {
            alert('Título e Solução são obrigatórios.');
            return;
        }

        const method = id ? 'PUT' : 'POST';
        try {
            const res = await fetch('api.php', {
                method: method,
                headers: { 'Content-Type': 'application/json' },
                body: JSON.stringify(payload)
            });
            
            const result = await res.json();
            if (result.error) throw new Error(result.error);

            modalInstance.hide();
            loadData(currentPage);
        } catch (err) {
            alert('Erro ao salvar: ' + err.message);
        }
    }

    function editRecord(id) {
        const item = currentData.find(x => x.id === id);
        if (item) openModal(item);
    }

    async function deleteRecord(id) {
        if (!confirm('Deseja realmente excluir este registro?')) return;
        try {
            const res = await fetch(`api.php?id=${id}`, { method: 'DELETE' });
            const result = await res.json();
            if (result.error) throw new Error(result.error);
            loadData(currentPage);
        } catch (err) {
            alert('Erro ao excluir: ' + err.message);
        }
    }

    function copyToClipboard(btn) {
        const pre = btn.nextElementSibling;
        navigator.clipboard.writeText(pre.innerText).then(() => {
            const originalHtml = btn.innerHTML;
            btn.innerHTML = '<i class="bi bi-check2"></i> Copiado!';
            btn.classList.replace('btn-copy', 'btn-success');
            setTimeout(() => {
                btn.innerHTML = originalHtml;
                btn.classList.replace('btn-success', 'btn-copy');
            }, 2000);
        });
    }

    function toggleDarkMode() {
        document.body.classList.toggle('dark-mode');
        const isDark = document.body.classList.contains('dark-mode');
        
        localStorage.setItem('kb_theme', isDark ? 'dark' : 'light');

        document.getElementById('btnDarkMode').innerHTML = isDark ? 
            '<i class="bi bi-sun"></i> Modo Claro' : '<i class="bi bi-moon-stars"></i> Modo Escuro';
    }

    function exportToCSV() {
        if (!currentData || currentData.length === 0) {
            alert('Nenhum dado disponível para exportar.');
            return;
        }

        const headers = ['ID', 'Título', 'Categoria', 'Tags', 'Descrição', 'Solução', 'Criado Em'];
        const rows = currentData.map(item => [
            item.id,
            `"${(item.titulo || '').replace(/"/g, '""')}"`,
            `"${(item.categoria || '').replace(/"/g, '""')}"`,
            `"${(item.tags || '').replace(/"/g, '""')}"`,
            `"${(item.descricao || '').replace(/"/g, '""')}"`,
            `"${(item.solucao || '').replace(/"/g, '""')}"`,
            item.criado_em || ''
        ]);

        const csvContent = 'data:text/csv;charset=utf-8,\uFEFF' + [headers.join(','), ...rows.map(e => e.join(','))].join('\n');
        const encodedUri = encodeURI(csvContent);
        const link = document.createElement('a');
        link.setAttribute('href', encodedUri);
        link.setAttribute('download', `base_conhecimento_export_${new Date().toISOString().split('T')[0]}.csv`);
        document.body.appendChild(link);
        link.click();
        document.body.removeChild(link);
    }

    function escapeHtml(text) {
        if (!text) return '';
        return text.replace(/&/g, "&amp;").replace(/</g, "&lt;").replace(/>/g, "&gt;").replace(/"/g, "&quot;").replace(/'/g, "&#039;");
    }
</script>
</body>
</html>
