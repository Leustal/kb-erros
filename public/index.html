<!DOCTYPE html>
<html lang="pt-BR">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Gerenciador de Documentação</title>
    <style>
        * {
            box-sizing: border-box;
            margin: 0;
            padding: 0;
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
        }

        body {
            background-color: #121214;
            color: #e1e1e6;
            padding: 20px;
        }

        .container {
            max-width: 1200px;
            margin: 0 auto;
        }

        h1 {
            margin-bottom: 20px;
            color: #00b37e;
        }

        .search-bar {
            margin-bottom: 20px;
            display: flex;
            gap: 10px;
        }

        .search-bar input {
            flex: 1;
            padding: 10px;
            border-radius: 5px;
            border: 1px solid #29292e;
            background: #202024;
            color: #fff;
        }

        table {
            width: 100%;
            border-collapse: collapse;
            background: #202024;
            border-radius: 8px;
            overflow: hidden;
            margin-bottom: 20px;
        }

        th, td {
            padding: 12px 15px;
            text-align: left;
            border-bottom: 1px solid #29292e;
        }

        th {
            background-color: #29292e;
            color: #00b37e;
        }

        tr:hover {
            background-color: #29292e;
        }

        .btn {
            padding: 8px 12px;
            border: none;
            border-radius: 4px;
            cursor: pointer;
            font-weight: bold;
            transition: background 0.2s;
        }

        .btn-primary { background: #00b37e; color: #fff; }
        .btn-primary:hover { background: #00875f; }
        .btn-danger { background: #f75a68; color: #fff; }
        .btn-danger:hover { background: #c8424f; }
        .btn-secondary { background: #323238; color: #8d8d99; }
        .btn-secondary:hover { background: #29292e; }

        /* Estilos do Modal */
        .modal-overlay {
            position: fixed;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            background: rgba(0, 0, 0, 0.75);
            display: none;
            justify-content: center;
            align-items: center;
            z-index: 1000;
        }

        .modal-overlay.active {
            display: flex;
        }

        .modal-content {
            background: #202024;
            width: 90%;
            max-width: 700px;
            border-radius: 8px;
            padding: 24px;
            border: 1px solid #323238;
            max-height: 90vh;
            overflow-y: auto;
        }

        .modal-header {
            display: flex;
            justify-content: space-between;
            align-items: center;
            margin-bottom: 20px;
        }

        /* Abas */
        .tabs {
            display: flex;
            gap: 10px;
            border-bottom: 1px solid #323238;
            margin-bottom: 20px;
        }

        .tab-btn {
            background: none;
            border: none;
            color: #8d8d99;
            padding: 10px 15px;
            cursor: pointer;
            font-size: 16px;
            border-bottom: 2px solid transparent;
        }

        .tab-btn.active {
            color: #00b37e;
            border-bottom-color: #00b37e;
            font-weight: bold;
        }

        .tab-content {
            display: none;
        }

        .tab-content.active {
            display: block;
        }

        .form-group {
            margin-bottom: 15px;
        }

        .form-group label {
            display: block;
            margin-bottom: 5px;
            color: #c4c4cc;
        }

        .form-group input,
        .form-group select,
        .form-group textarea {
            width: 100%;
            padding: 10px;
            background: #121214;
            border: 1px solid #323238;
            border-radius: 4px;
            color: #fff;
            resize: vertical;
        }

        .modal-actions {
            display: flex;
            justify-content: flex-end;
            gap: 10px;
            margin-top: 20px;
        }

        /* Paginação */
        .pagination {
            display: flex;
            justify-content: center;
            gap: 5px;
            align-items: center;
        }
    </style>
</head>
<body>

<div class="container">
    <h1>Documentações e Chamados</h1>

    <div class="search-bar">
        <input type="text" id="input-search" placeholder="Pesquisar por título, problema, solução, tags..." onkeyup="filtrarDados()">
    </div>

    <table>
        <thead>
            <tr>
                <th>ID</th>
                <th>Título</th>
                <th>Categoria</th>
                <th>Ações</th>
            </tr>
        </thead>
        <tbody id="table-body">
            <!-- Os dados serão injetados via JS -->
        </tbody>
    </table>

    <div class="pagination" id="pagination"></div>
</div>

<!-- Modal de Edição -->
<div class="modal-overlay" id="modal-edit">
    <div class="modal-content">
        <div class="modal-header">
            <h2>Editar Registro #<span id="modal-id-label"></span></h2>
            <button class="btn btn-secondary" onclick="fecharModal()">X</button>
        </div>

        <!-- Navegação das Abas -->
        <div class="tabs">
            <button class="tab-btn active" onclick="switchTab('aba-solucao')">Solução</button>
            <button class="tab-btn" onclick="switchTab('aba-auditoria')">Auditoria</button>
        </div>

        <form id="form-edit" onsubmit="salvarEdicao(event)">
            <input type="hidden" id="edit-id">

            <!-- ABA 1: SOLUÇÃO -->
            <div id="aba-solucao" class="tab-content active">
                <div class="form-group">
                    <label for="edit-titulo">Título</label>
                    <!-- required removido para permitir salvar vazio -->
                    <input type="text" id="edit-titulo">
                </div>

                <div class="form-group">
                    <label for="edit-categoria">Categoria</label>
                    <input type="text" id="edit-categoria">
                </div>

                <div class="form-group">
                    <label for="edit-tags">Tags</label>
                    <input type="text" id="edit-tags">
                </div>

                <div class="form-group">
                    <label for="edit-descricao">Descrição / Problema</label>
                    <textarea id="edit-descricao" rows="4"></textarea>
                </div>

                <div class="form-group">
                    <label for="edit-solucao">Solução</label>
                    <!-- required removido para permitir salvar vazio -->
                    <textarea id="edit-solucao" rows="4"></textarea>
                </div>
            </div>

            <!-- ABA 2: AUDITORIA -->
            <div id="aba-auditoria" class="tab-content">
                <div class="form-group">
                    <label for="edit-nota">Nota Final</label>
                    <input type="number" step="0.1" id="edit-nota">
                </div>

                <div class="form-group">
                    <label for="edit-veredito">Veredito</label>
                    <input type="text" id="edit-veredito">
                </div>

                <div class="form-group">
                    <label for="edit-objetivo">Objetivo</label>
                    <textarea id="edit-objetivo" rows="3"></textarea>
                </div>

                <div class="form-group">
                    <label for="edit-oportunidade">Oportunidade PS</label>
                    <textarea id="edit-oportunidade" rows="3"></textarea>
                </div>
            </div>

            <div class="modal-actions">
                <button type="button" class="btn btn-secondary" onclick="fecharModal()">Cancelar</button>
                <button type="submit" class="btn btn-primary">Salvar Alterações</button>
            </div>
        </form>
    </div>
</div>

<script>
    let registros = [];
    let currentPage = 1;

    document.addEventListener('DOMContentLoaded', () => {
        carregarDados();
    });

    // Carregar os dados da API
    async function carregarDados(page = 1) {
        const search = document.getElementById('input-search').value;
        try {
            const response = await fetch(`api.php?action=read&page=${page}&search=${encodeURIComponent(search)}`);
            const result = await response.json();
            
            registros = result.data || [];
            renderTabela(registros);
            renderPaginacao(result.total_pages, result.page);
        } catch (error) {
            console.error('Erro ao carregar registros:', error);
        }
    }

    // Renderizar tabela de exibição
    function renderTabela(dados) {
        const tbody = document.getElementById('table-body');
        tbody.innerHTML = '';

        if (dados.length === 0) {
            tbody.innerHTML = '<tr><td colspan="4" style="text-align:center;">Nenhum registro encontrado.</td></tr>';
            return;
        }

        dados.forEach(item => {
            const tr = document.createElement('tr');
            tr.innerHTML = `
                <td>${item.id}</td>
                <td>${escapeHtml(item.titulo || '(Sem título)')}</td>
                <td>${escapeHtml(item.categoria || '-')}</td>
                <td>
                    <button class="btn btn-primary" onclick="abrirModal(${item.id})">Editar</button>
                    <button class="btn btn-danger" onclick="deletarRegistro(${item.id})">Excluir</button>
                </td>
            `;
            tbody.appendChild(tr);
        });
    }

    // Controle das Abas no Modal
    function switchTab(tabId) {
        document.querySelectorAll('.tab-content').forEach(tab => tab.classList.remove('active'));
        document.querySelectorAll('.tab-btn').forEach(btn => btn.classList.remove('active'));

        document.getElementById(tabId).classList.add('active');
        event.currentTarget.classList.add('active');
    }

    // Abrir Modal e Preencher Campos
    function abrirModal(id) {
        const registro = registros.find(r => r.id == id);
        if (!registro) return;

        document.getElementById('edit-id').value = registro.id;
        document.getElementById('modal-id-label').innerText = registro.id;

        // Aba Solução
        document.getElementById('edit-titulo').value = registro.titulo || '';
        document.getElementById('edit-categoria').value = registro.categoria || '';
        document.getElementById('edit-tags').value = registro.tags || '';
        document.getElementById('edit-descricao').value = registro.descricao || '';
        document.getElementById('edit-solucao').value = registro.solucao || '';

        // Aba Auditoria
        document.getElementById('edit-nota').value = registro.nota_final ?? '';
        document.getElementById('edit-veredito').value = registro.veredito || '';
        document.getElementById('edit-objetivo').value = registro.objetivo || '';
        document.getElementById('edit-oportunidade').value = registro.oportunidade_ps || '';

        // Reseta para a primeira aba
        switchTabDirect('aba-solucao');

        document.getElementById('modal-edit').classList.add('active');
    }

    function switchTabDirect(tabId) {
        document.querySelectorAll('.tab-content').forEach(tab => tab.classList.remove('active'));
        document.querySelectorAll('.tab-btn').forEach(btn => btn.classList.remove('active'));

        document.getElementById(tabId).classList.add('active');
        const activeBtn = Array.from(document.querySelectorAll('.tab-btn')).find(b => b.getAttribute('onclick').includes(tabId));
        if (activeBtn) activeBtn.classList.add('active');
    }

    function fecharModal() {
        document.getElementById('modal-edit').classList.remove('active');
    }

    // Salvar sem travas ou validações obrigatórias
    async function salvarEdicao(event) {
        event.preventDefault();

        const payload = {
            id: document.getElementById('edit-id').value,
            aba_solucao: {
                titulo: document.getElementById('edit-titulo').value.trim(),
                categoria: document.getElementById('edit-categoria').value.trim(),
                tags: document.getElementById('edit-tags').value.trim(),
                problema: document.getElementById('edit-descricao').value.trim(),
                solucao: document.getElementById('edit-solucao').value.trim()
            },
            aba_auditoria: {
                nota_final: document.getElementById('edit-nota').value,
                veredito: document.getElementById('edit-veredito').value.trim(),
                objetivo: document.getElementById('edit-objetivo').value.trim(),
                oportunidade_ps: document.getElementById('edit-oportunidade').value.trim()
            }
        };

        try {
            const response = await fetch('api.php?action=update', {
                method: 'POST',
                headers: { 'Content-Type': 'application/json' },
                body: JSON.stringify(payload)
            });

            const result = await response.json();

            if (result.success) {
                fecharModal();
                carregarDados(currentPage);
            } else {
                alert('Erro ao salvar no banco: ' + (result.error || 'Erro desconhecido'));
            }
        } catch (error) {
            console.error('Erro na requisição:', error);
            alert('Falha na comunicação com o servidor.');
        }
    }

    // Deletar registro
    async function deletarRegistro(id) {
        if (!confirm('Deseja realmente excluir este registro?')) return;

        try {
            const response = await fetch(`api.php?action=delete&id=${id}`);
            const result = await response.json();

            if (result.success) {
                carregarDados(currentPage);
            } else {
                alert('Erro ao excluir: ' + result.error);
            }
        } catch (error) {
            console.error('Erro ao excluir:', error);
        }
    }

    // Filtro e Paginação
    let timeoutSearch = null;
    function filtrarDados() {
        clearTimeout(timeoutSearch);
        timeoutSearch = setTimeout(() => {
            carregarDados(1);
        }, 300);
    }

    function renderPaginacao(totalPages, page) {
        currentPage = page;
        const container = document.getElementById('pagination');
        container.innerHTML = '';

        for (let i = 1; i <= totalPages; i++) {
            const btn = document.createElement('button');
            btn.className = `btn ${i === page ? 'btn-primary' : 'btn-secondary'}`;
            btn.innerText = i;
            btn.onclick = () => carregarDados(i);
            container.appendChild(btn);
        }
    }

    function escapeHtml(text) {
        return text.replace(/[&<>"']/g, function(m) {
            return { '&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;', "'": '&#039;' }[m];
        });
    }
</script>

</body>
</html>
